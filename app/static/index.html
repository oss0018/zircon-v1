                            <template x-for="link in otxLinks(src.data)" :key="link.label">
                              <a :href="link.url" target="_blank" rel="noopener noreferrer"
                                 class="badge badge-gray" style="text-decoration:none;"
                                 x-text="'↗ ' + link.label"></a>
                            </template>
                          </div>
                        </template>
                        <!-- Human-readable fields -->
                        <template x-if="!src.error && src.data && !src.data.not_found">
                          <div class="ti-fields-grid">
                            <template x-for="field in humanFields(src.source, src.data)" :key="field.label">
                              <div class="ti-field" :class="field.highlight ? 'ti-field-' + field.highlight : ''">
                                <div class="ti-field-label" x-text="field.label"></div>
                                <div class="ti-field-value">
                                  <template x-if="field.isLink">
                                    <a :href="field.value" target="_blank" rel="noopener noreferrer"
                                       class="text-green" style="word-break:break-all;" x-text="field.value"></a>
                                  </template>
                                  <template x-if="!field.isLink">
                                    <span style="word-break:break-word;" x-text="field.value"></span>
                                  </template>
                                </div>
                              </div>
                            </template>
                          </div>
                        </template>
                        <template x-if="src.error">
                          <div style="font-size:12px;color:#f87171;padding:4px 0;" x-text="src.error"></div>
                        </template>
                        <template x-if="!src.error && (!src.data || src.data.not_found)">
                          <div style="font-size:12px;color:var(--text-muted);">No data found for this IOC</div>
                        </template>
                        <!-- OTX rich pulse list (Sources tab) -->
                        <template x-if="src.source === 'alienvault' && src.data && src.data.pulse_info && src.data.pulse_info.pulses && src.data.pulse_info.pulses.length > 0">
                          <div style="margin-top:12px;">
                            <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">
                              Pulses (<span x-text="src.data.pulse_info.pulses.length"></span>)
                            </div>
                            <template x-for="(pulse, idx) in src.data.pulse_info.pulses.slice(0,20)" :key="pulse.id || idx">
                              <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:6px;padding:8px 10px;margin-bottom:6px;">
                                <div class="flex items-center gap-2 flex-wrap mb-1">
                                  <span style="font-size:12px;font-weight:700;color:var(--text-primary);" x-text="pulse.name"></span>
                                  <span x-show="pulse.tlp"
                                        :style="`font-size:9px;padding:1px 5px;border-radius:4px;font-weight:700;background:${pulse.tlp==='red'?'rgba(255,80,80,0.15)':pulse.tlp==='amber'?'rgba(255,200,0,0.15)':pulse.tlp==='green'?'rgba(0,200,80,0.15)':'rgba(148,163,184,0.15)'};color:${pulse.tlp==='red'?'#f87171':pulse.tlp==='amber'?'#fbbf24':pulse.tlp==='green'?'#34d399':'#94a3b8'};`"
                                        x-text="'TLP:' + (pulse.tlp || 'WHITE').toUpperCase()"></span>
                                  <span x-show="pulse.author && pulse.author.username" style="font-size:10px;color:var(--text-muted);" x-text="'@ ' + pulse.author.username"></span>
                                </div>
                                <template x-if="pulse.tags && pulse.tags.length > 0">
                                  <div class="flex gap-1 flex-wrap mb-1">
                                    <template x-for="tag in pulse.tags.slice(0,8)" :key="tag">
                                      <span class="badge badge-gray text-xs" x-text="tag"></span>
                                    </template>
                                  </div>
                                </template>
                                <div class="flex gap-3 flex-wrap" style="font-size:10px;color:var(--text-muted);">
                                  <span x-show="pulse.created" x-text="'Created: ' + formatDate(pulse.created)"></span>
                                  <span x-show="pulse.modified" x-text="'Modified: ' + formatDate(pulse.modified)"></span>
                                  <template x-if="pulse.references && pulse.references.length > 0">
                                    <span>
                                      <a :href="pulse.references[0]" target="_blank" rel="noopener noreferrer"
                                         class="text-green" style="text-decoration:none;">↗ Reference</a>
                                      <span x-show="pulse.references.length > 1" x-text="' +' + (pulse.references.length - 1) + ' more'"></span>
                                    </span>
                                  </template>
                                </div>
                              </div>
                            </template>
                            <div x-show="src.data.pulse_info.pulses.length > 20"
                                 style="font-size:11px;color:var(--text-muted);margin-top:4px;"
                                 x-text="'+' + (src.data.pulse_info.pulses.length - 20) + ' more pulses (see Raw JSON)'"></div>
                          </div>
                        </template>
                        <!-- OTX Validation section (Sources tab) -->
                        <template x-if="src.source === 'alienvault' && src.data && src.data.validation && src.data.validation.length > 0">
                          <div style="margin-top:10px;">
                            <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">Validation</div>
                            <template x-for="v in src.data.validation" :key="JSON.stringify(v)">
                              <div style="font-size:11px;color:var(--text-secondary);padding:2px 0;"
                                   x-text="(v.source || '') + (v.message ? ': ' + v.message : '') + (v.name ? ' (' + v.name + ')' : '')"></div>
                            </template>
                          </div>
                        </template>

                        <!-- VirusTotal: engine detections list -->
                        <template x-if="src.source === 'virustotal' && vtEngineDetections(src.data).length > 0">
                          <div style="margin-top:12px;">
                            <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">
                              Engine Detections (<span x-text="vtEngineDetections(src.data).length"></span>)
                            </div>
                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;">
                              <template x-for="det in vtEngineDetections(src.data)" :key="det.engine">
                                <div style="background:rgba(255,80,80,0.07);border:1px solid rgba(255,80,80,0.15);border-radius:4px;padding:4px 7px;font-size:10px;">
                                  <span style="font-weight:600;color:var(--text-primary);" x-text="det.engine"></span>
                                  <span style="color:#f87171;margin-left:4px;" x-text="det.result"></span>
                                </div>
                              </template>
                            </div>
                          </div>
                        </template>

                        <!-- AbuseIPDB: recent abuse reports -->
                        <template x-if="src.source === 'abuseipdb' && abuseRecentReports(src.data).length > 0">
                          <div style="margin-top:12px;">
                            <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">
                              Recent Abuse Reports (<span x-text="abuseRecentReports(src.data).length"></span>)
                            </div>
                            <template x-for="(rep, idx) in abuseRecentReports(src.data)" :key="idx">
                              <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:4px;padding:5px 8px;margin-bottom:4px;font-size:11px;">
                                <div class="flex items-center justify-between mb-1">
                                  <span style="color:var(--text-muted);" x-text="formatDate(rep.date)"></span>
                                  <span x-show="rep.country" class="badge badge-gray text-xs" x-text="rep.country"></span>
                                </div>
                                <div x-show="rep.comment" style="color:var(--text-secondary);" x-text="rep.comment"></div>
                              </div>
                            </template>
                          </div>
                        </template>

                        <!-- Shodan: services/banners list -->
                        <template x-if="src.source === 'shodan' && shodanServices(src.data).length > 0">
                          <div style="margin-top:12px;">
                            <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">
                              Services / Banners (<span x-text="shodanServices(src.data).length"></span>)
                            </div>
                            <template x-for="(svc, idx) in shodanServices(src.data)" :key="idx">
                              <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:4px;padding:5px 8px;margin-bottom:4px;font-size:11px;">
                                <div class="flex items-center gap-2 flex-wrap">
                                  <span class="badge badge-gray font-mono text-xs" x-text="svc.port + '/' + (svc.proto || 'tcp')"></span>
                                  <span x-show="svc.product" style="font-weight:600;color:var(--text-primary);" x-text="svc.product"></span>
                                  <span x-show="svc.version" style="color:var(--text-muted);" x-text="'v' + svc.version"></span>
                                </div>
                                <div x-show="svc.banner" style="color:var(--text-muted);margin-top:2px;font-family:monospace;" x-text="svc.banner"></div>
                              </div>
                            </template>
                            <!-- Shodan CVE list -->
                            <template x-if="src.data.vulns && Object.keys(src.data.vulns).length > 0">
                              <div style="margin-top:8px;">
                                <div style="font-size:11px;font-weight:700;color:#f87171;margin-bottom:4px;">
                                  CVEs (<span x-text="Object.keys(src.data.vulns).length"></span>)
                                </div>
                                <div class="flex gap-1 flex-wrap">
                                  <template x-for="cve in Object.keys(src.data.vulns).slice(0,20)" :key="cve">
                                    <span class="badge" style="background:rgba(255,80,80,0.12);color:#f87171;font-size:10px;" x-text="cve"></span>
                                  </template>
                                  <span x-show="Object.keys(src.data.vulns).length > 20"
                                        style="font-size:10px;color:var(--text-muted);"
                                        x-text="'+' + (Object.keys(src.data.vulns).length - 20) + ' more'"></span>
                                </div>
                              </div>
                            </template>
                          </div>
                        </template>

                        <!-- URLhaus: malicious URLs list -->
                        <template x-if="src.source === 'urlhaus' && urlhausUrlList(src.data).length > 0">
                          <div style="margin-top:12px;">
                            <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">
                              Malicious URLs (<span x-text="urlhausUrlList(src.data).length"></span>)
                            </div>
                            <template x-for="(u, idx) in urlhausUrlList(src.data)" :key="idx">
                              <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,80,80,0.15);border-radius:4px;padding:5px 8px;margin-bottom:4px;font-size:11px;">
                                <div class="flex items-center gap-2 flex-wrap mb-1">
                                  <span :class="u.status === 'online' ? 'badge badge-red' : 'badge badge-gray'" x-text="u.status || 'unknown'"></span>
                                  <span x-show="u.threat" class="badge badge-gray text-xs" x-text="u.threat"></span>
                                  <span x-show="u.date_added" style="color:var(--text-muted);font-size:10px;" x-text="u.date_added"></span>
                                </div>
                                <div style="font-family:monospace;color:var(--text-secondary);word-break:break-all;" x-text="u.url"></div>
                                <template x-if="u.tags && u.tags.length > 0">
                                  <div class="flex gap-1 flex-wrap mt-1">
                                    <template x-for="tag in u.tags.slice(0,5)" :key="tag">
                                      <span class="badge badge-gray text-xs" x-text="tag"></span>
                                    </template>
                                  </div>
                                </template>
                              </div>
                            </template>
                          </div>
                        </template>

                        <!-- URLscan: scan results list -->
                        <template x-if="src.source === 'urlscan' && urlscanResultList(src.data).length > 0">
                          <div style="margin-top:12px;">
                            <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">
                              Scan Results (<span x-text="urlscanResultList(src.data).length"></span>)
                            </div>
                            <template x-for="(scan, idx) in urlscanResultList(src.data)" :key="idx">
                              <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:4px;padding:5px 8px;margin-bottom:4px;font-size:11px;">
                                <div class="flex items-center gap-2 flex-wrap mb-1">
                                  <span :class="scan.malicious ? 'badge badge-red' : 'badge badge-green'" x-text="scan.malicious ? 'Malicious' : 'Clean'"></span>
                                  <span x-show="scan.score" class="badge badge-gray text-xs" x-text="'Score: ' + scan.score"></span>
                                  <span x-show="scan.country" class="badge badge-gray text-xs" x-text="scan.country"></span>
                                  <span x-show="scan.time" style="color:var(--text-muted);font-size:10px;" x-text="formatDate(scan.time)"></span>
                                </div>
                                <div x-show="scan.url" style="font-family:monospace;color:var(--text-secondary);word-break:break-all;font-size:10px;" x-text="scan.url"></div>
                                <a x-show="scan.report" :href="scan.report" target="_blank" rel="noopener noreferrer"
                                   class="text-green" style="font-size:10px;text-decoration:none;">↗ View full report</a>
                              </div>
                            </template>
                          </div>
                        </template>

                        <!-- MalwareBazaar: sample details -->
                        <template x-if="src.source === 'malwarebazaar' && mbSampleDetails(src.data)">
                          <div style="margin-top:12px;">
                            <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">Sample Details</div>
                            <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,80,80,0.15);border-radius:5px;padding:8px 10px;">
                              <template x-if="mbSampleDetails(src.data).sha256">
                                <div style="font-size:10px;margin-bottom:3px;">
                                  <span style="color:var(--text-muted);">SHA256: </span>
                                  <span class="font-mono" style="color:var(--text-secondary);word-break:break-all;" x-text="mbSampleDetails(src.data).sha256"></span>
                                </div>
                              </template>
                              <div class="flex gap-2 flex-wrap" style="font-size:11px;margin-top:4px;">
                                <template x-if="mbSampleDetails(src.data).file_name">
                                  <span><span style="color:var(--text-muted);">File: </span><span x-text="mbSampleDetails(src.data).file_name"></span></span>
                                </template>
                                <template x-if="mbSampleDetails(src.data).file_type">
                                  <span><span style="color:var(--text-muted);">Type: </span><span x-text="mbSampleDetails(src.data).file_type"></span></span>
                                </template>
                                <template x-if="mbSampleDetails(src.data).signature">
                                  <span style="color:#f87171;font-weight:600;" x-text="mbSampleDetails(src.data).signature"></span>
                                </template>
                              </div>
                              <template x-if="mbSampleDetails(src.data).tags && mbSampleDetails(src.data).tags.length > 0">
                                <div class="flex gap-1 flex-wrap mt-2">
                                  <template x-for="tag in mbSampleDetails(src.data).tags.slice(0,8)" :key="tag">
                                    <span class="badge badge-gray text-xs" x-text="tag"></span>
                                  </template>
                                </div>
                              </template>
                            </div>
                          </div>
                        </template>

                        <!-- ThreatFox: IOC entries list -->
                        <template x-if="src.source === 'threatfox' && tfIocEntries(src.data).length > 0">
                          <div style="margin-top:12px;">
                            <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">
                              IOC Entries (<span x-text="tfIocEntries(src.data).length"></span>)
                            </div>
                            <template x-for="(ioc, idx) in tfIocEntries(src.data)" :key="idx">
                              <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,80,80,0.15);border-radius:4px;padding:6px 8px;margin-bottom:5px;font-size:11px;">

                                  <span style="font-weight:700;color:#f87171;" x-text="ioc.malware"></span>
                                  <span x-show="ioc.ioc_type" class="badge badge-gray text-xs" x-text="ioc.ioc_type"></span>
                                  <span x-show="ioc.confidence !== ''" :class="ioc.confidence >= 75 ? 'badge badge-red' : 'badge badge-gray'" x-text="ioc.confidence + '% confidence'"></span>
                                </div>
                                <div x-show="ioc.ioc" style="font-family:monospace;color:var(--text-secondary);font-size:10px;word-break:break-all;" x-text="ioc.ioc"></div>
                                <div class="flex gap-3 flex-wrap mt-1" style="font-size:10px;color:var(--text-muted);">
                                  <span x-show="ioc.first_seen" x-text="'First: ' + ioc.first_seen"></span>
                                  <span x-show="ioc.last_seen" x-text="'Last: ' + ioc.last_seen"></span>
                                </div>
                                <template x-if="ioc.tags && ioc.tags.length > 0">
                                  <div class="flex gap-1 flex-wrap mt-1">
                                    <template x-for="tag in ioc.tags.slice(0,6)" :key="tag">
                                      <span class="badge badge-gray text-xs" x-text="tag"></span>
                                    </template>
                                  </div>
                                </template>
                              </div>
                            </template>
                          </div>
                        </template>

                        <!-- HIBP: breach list -->
                        <template x-if="src.source === 'hibp' && hibpBreachList(src.data).length > 0">
                          <div style="margin-top:12px;">
                            <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">
                              Data Breaches (<span x-text="hibpBreachList(src.data).length"></span>)
                            </div>
                            <template x-for="(breach, idx) in hibpBreachList(src.data)" :key="breach.name">
                              <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,200,0,0.15);border-radius:4px;padding:5px 8px;margin-bottom:4px;font-size:11px;">
                                <div class="flex items-center gap-2 flex-wrap mb-1">
                                  <span style="font-weight:700;color:var(--text-primary);" x-text="breach.name"></span>
                                  <span x-show="breach.date" class="badge badge-gray text-xs" x-text="breach.date"></span>
                                  <span x-show="breach.count" class="badge badge-gray text-xs" x-text="(breach.count || 0).toLocaleString() + ' records'"></span>
                                </div>
                                <template x-if="breach.data_classes && breach.data_classes.length > 0">
                                  <div class="flex gap-1 flex-wrap">
                                    <template x-for="dc in breach.data_classes" :key="dc">
                                      <span class="badge badge-gray text-xs" x-text="dc"></span>
                                    </template>
                                  </div>
                                </template>
                              </div>
                            </template>
                          </div>
                        </template>

                        <!-- IntelX: records list -->
                        <template x-if="src.source === 'intelx' && intelxRecordList(src.data).length > 0">
                          <div style="margin-top:12px;">
                            <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">
                              Records (<span x-text="intelxRecordList(src.data).length"></span>
                              <span x-show="src.data.total > intelxRecordList(src.data).length"
                                    x-text="' of ' + src.data.total + ' total'"></span>)
                            </div>
                            <template x-for="(rec, idx) in intelxRecordList(src.data)" :key="idx">
                              <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:4px;padding:5px 8px;margin-bottom:3px;font-size:11px;">
                                <div class="flex items-center gap-2 flex-wrap">
                                  <span x-show="rec.type !== ''" class="badge badge-gray text-xs" x-text="'Type ' + rec.type"></span>
                                  <span x-show="rec.bucket" class="badge badge-gray text-xs" x-text="rec.bucket"></span>
                                  <span x-show="rec.date" style="color:var(--text-muted);font-size:10px;" x-text="formatDate(rec.date)"></span>
                                  <span x-show="rec.size" style="color:var(--text-muted);font-size:10px;" x-text="rec.size + ' bytes'"></span>
                                </div>
                                <div x-show="rec.name" style="color:var(--text-secondary);margin-top:2px;font-size:10px;" x-text="rec.name"></div>
                              </div>
                            </template>
                          </div>
                        </template>

                        <!-- Censys: services list -->
                        <template x-if="src.source === 'censys' && censysServiceList(src.data).length > 0">
                          <div style="margin-top:12px;">
                            <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">
                              Services (<span x-text="censysServiceList(src.data).length"></span>)
                            </div>
                            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px;">
                              <template x-for="(svc, idx) in censysServiceList(src.data)" :key="idx">
                                <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:4px;padding:5px 8px;font-size:11px;">
                                  <div class="flex items-center gap-1">
                                    <span class="badge badge-gray font-mono text-xs" x-text="svc.port"></span>
                                    <span x-show="svc.proto" style="color:var(--text-muted);font-size:10px;" x-text="svc.proto"></span>
                                  </div>
                                  <div x-show="svc.name && svc.name !== 'UNKNOWN'" style="font-weight:600;color:var(--text-primary);margin-top:2px;" x-text="svc.name"></div>
                                  <div x-show="svc.software" style="color:var(--text-muted);font-size:10px;" x-text="svc.software"></div>
                                </div>
                              </template>
                            </div>
                          </div>
                        </template>

                        <!-- SecurityTrails: DNS breakdown -->
                        <template x-if="src.source === 'securitytrails' && stDnsBreakdown(src.data).length > 0">
                          <div style="margin-top:12px;">
                            <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">DNS Records</div>
                            <template x-for="section in stDnsBreakdown(src.data)" :key="section.type">
                              <div style="margin-bottom:8px;">
                                <span class="badge badge-gray text-xs" x-text="section.type"></span>
                                <div class="flex gap-1 flex-wrap mt-1">
                                  <template x-for="val in section.values" :key="val">
                                    <span class="badge badge-gray font-mono text-xs" style="word-break:break-all;" x-text="val.length > 60 ? val.slice(0,60) + '…' : val"></span>
                                  </template>
                                </div>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>

                </div>
              </template>
              <!-- No result yet placeholder -->
              <template x-if="!searchResult && !lookupLoading">
                <div class="card text-center" style="padding:40px 24px;margin-bottom:16px;">
                  <div style="font-size:40px;margin-bottom:10px;">🔍</div>
                  <div style="font-size:15px;font-weight:600;color:var(--text-primary);margin-bottom:4px;">Enter an IOC to get started</div>
                  <div style="font-size:13px;color:var(--text-muted);">Supported: IP address, domain, hash (MD5/SHA1/SHA256), URL, email</div>
                  <div style="font-size:12px;color:var(--text-muted);margin-top:8px;">
                    Free connectors (no API key needed): URLhaus, PhishTank, MalwareBazaar, ThreatFox
                  </div>
                </div>
              </template>

              <!-- ── ACTIVITY CHARTS (per integration) ──────── -->
              <template x-if="stats && stats.service_stats && stats.service_stats.length > 0">
                <div class="card mb-4">
                  <div class="card-title">📊 Source Activity — Last 7 Days</div>
                  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:8px;">
                    <template x-for="svc in stats.service_stats" :key="svc.service_type">
                      <div class="ti-integration-card">
                        <div class="flex items-center justify-between mb-1">
                          <span style="font-weight:600;font-size:12px;" x-text="svc.name"></span>
                          <span class="badge badge-green text-xs" x-text="svc.total + ' lookups'"></span>
                        </div>
                        <div class="ti-chart-container">
                          <canvas :id="'ti-chart-' + svc.service_type"></canvas>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <!-- ── LOOKUP HISTORY TABLE ───────────────────── -->
              <div class="card">
                <div class="card-title flex items-center justify-between">
                  <span>📋 Recent Searches</span>
                  <span x-show="historyLoading" class="spinner" style="width:14px;height:14px;"></span>
                </div>
                <!-- Filters -->
                <div class="flex gap-2 flex-wrap mb-3">
                  <select class="form-select" x-model="historyFilter.type" style="width:130px;">
                    <option value="">All types</option>
                    <template x-for="tp in iocTypes" :key="tp">
                      <option :value="tp" x-text="tp"></option>
                    </template>
                  </select>
                  <select class="form-select" x-model="historyFilter.source" style="width:160px;">
                    <option value="">All sources</option>
                    <template x-for="src in availableHistorySources()" :key="src">
                      <option :value="src" x-text="src"></option>
                    </template>
                  </select>
                  <input class="form-input" type="date" x-model="historyFilter.date" style="width:150px;" />
                  <button class="btn btn-sm btn-secondary"
                          x-show="historyFilter.type || historyFilter.source || historyFilter.date"
                          @click="clearHistoryFilters()">✕ Clear</button>
                </div>
                <template x-if="filteredHistory().length === 0">
                  <div class="text-center text-muted" style="padding:30px;">
                    <div style="font-size:24px;margin-bottom:8px;">📭</div>
                    <div>No search history yet</div>
                  </div>
                </template>
                <template x-if="filteredHistory().length > 0">
                  <div style="overflow-x:auto;">
                    <table class="table">
                      <thead>
                        <tr>
                          <th>IOC</th><th>Type</th><th>Sources</th><th>Date</th><th></th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="entry in filteredHistory()" :key="entry.id">
                          <tr @contextmenu.prevent="showCtxMenu($event, entry)">
                            <td class="font-mono text-green" x-text="entry.ioc_value"
                                style="max-width:220px;overflow:hidden;text-overflow:ellipsis;"></td>
                            <td><span class="badge badge-gray" x-text="entry.ioc_type"></span></td>
                            <td>
                              <div class="flex gap-1 flex-wrap">
                                <template x-for="src in (entry.sources || []).slice(0,5)" :key="src">
                                  <span class="badge badge-gray text-xs" x-text="src"></span>
                                </template>
                                <span x-show="(entry.sources || []).length > 5" class="badge badge-gray text-xs"
                                      x-text="'+' + ((entry.sources || []).length - 5)"></span>
                              </div>
                            </td>
                            <td class="text-muted text-sm" x-text="formatDate(entry.created_at)"></td>
                            <td>
                              <button class="btn btn-sm btn-secondary" @click="openHistoryDetail(entry)">Details</button>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>
              </div>

              <!-- ── RAW DATA MODAL ─────────────────────────── -->
              <template x-if="rawModal.show">
                <div class="modal-overlay" @click.self="closeRaw()">
                  <div class="modal" style="max-width:700px;max-height:80vh;display:flex;flex-direction:column;">
                    <div class="modal-header">
                      <span x-text="'Raw JSON — ' + rawModal.source"></span>
                      <button class="btn btn-sm btn-secondary" @click="closeRaw()">✕</button>
                    </div>
                    <div style="overflow:auto;flex:1;padding:16px;">
                      <pre class="code-block" style="font-size:11px;white-space:pre-wrap;word-break:break-all;"
                           x-text="prettyJson(rawModal.data)"></pre>
                    </div>
                  </div>
                </div>
              </template>

              <!-- ── HISTORY DETAIL MODAL ──────────────────── -->
              <template x-if="historyDetailModal.show">
                <div class="modal-overlay" @click.self="closeHistoryDetail()">
                  <div class="modal" style="max-width:860px;max-height:88vh;display:flex;flex-direction:column;">
                    <div class="modal-header">
                      <template x-if="historyDetailModal.entry">
                        <span>Lookup — <span class="font-mono text-green" x-text="historyDetailModal.entry.ioc_value"></span></span>
                      </template>
                      <template x-if="!historyDetailModal.entry">
                        <span>Loading…</span>
                      </template>
                      <button class="btn btn-sm btn-secondary" @click="closeHistoryDetail()">✕</button>
                    </div>
                    <template x-if="historyDetailLoading">
                      <div class="text-center" style="padding:40px;">
                        <span class="spinner" style="width:20px;height:20px;"></span>
                      </div>
                    </template>
                    <template x-if="historyDetailModal.entry">
                      <div style="overflow:auto;flex:1;padding:16px;">
                        <!-- Meta row -->
                        <div class="flex gap-2 mb-3 flex-wrap">
                          <span class="badge badge-gray" x-text="'Type: ' + historyDetailModal.entry.ioc_type"></span>
                          <span class="badge badge-gray" x-text="'Date: ' + formatDate(historyDetailModal.entry.created_at)"></span>
                          <template x-for="src in (historyDetailModal.entry.sources || [])" :key="src">
                            <span class="badge badge-green" x-text="src"></span>
                          </template>
                        </div>
                        <!-- Normalized summary from history -->
                        <template x-if="historyDetailModal.entry.normalized">
                          <div class="ti-summary-card mb-3"
                               :class="'verdict-' + historyDetailModal.entry.normalized.verdict">
                            <div class="flex items-center gap-3 flex-wrap mb-2">
                              <span x-text="verdictIcon(historyDetailModal.entry.normalized.verdict)" style="font-size:28px;"></span>
                              <span class="ti-sev-badge" :class="severityClass(historyDetailModal.entry.normalized.severity)"
                                    x-text="severityLabel(historyDetailModal.entry.normalized.severity)"></span>
                              <span style="font-size:12px;color:var(--text-secondary);" x-text="historyDetailModal.entry.normalized.summary"></span>
                            </div>
                            <div class="flex gap-1 flex-wrap">
                              <template x-for="tag in (historyDetailModal.entry.normalized.tags || []).slice(0,8)" :key="tag">
                                <span class="badge badge-gray text-xs" x-text="tag"></span>
                              </template>
                            </div>
                          </div>
                        </template>
                        <!-- Per-source cards -->
                        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;">
                          <template x-for="[svc, data] in Object.entries(historyDetailModal.entry.results || {})" :key="svc">
                            <div class="ti-result-card">
                              <div class="flex items-center justify-between mb-2">
                                <span style="font-weight:700;font-size:12px;" x-text="svc"></span>
                              </div>
                              <div class="ti-fields-grid">
                                <template x-for="field in humanFields(svc, data)" :key="field.label">
                                  <div class="ti-field" :class="field.highlight ? 'ti-field-' + field.highlight : ''">
                                    <div class="ti-field-label" x-text="field.label"></div>
                                    <div class="ti-field-value" x-text="field.value"></div>
                                  </div>
                                </template>
                              </div>
                              <details style="margin-top:6px;">
                                <summary style="cursor:pointer;font-size:11px;color:var(--text-muted);">Raw JSON</summary>
                                <pre style="font-size:10px;white-space:pre-wrap;word-break:break-all;color:var(--text-secondary);margin-top:4px;"
                                     x-text="prettyJson(data)"></pre>
                              </details>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <!-- Context Menu — Threat Intel History -->
              <div x-show="ctxMenu.show"
                   class="context-menu"
                   :style="`left:${ctxMenu.x}px;top:${ctxMenu.y}px;`"
                   @click.stop
                   @click.outside="closeCtxMenu()">
                <button class="context-menu-item" @click="ctxOpenInNewWindow()">🪟 Open in new window</button>
                <button class="context-menu-item" @click="ctxOpenDetail()">🔍 Open detail</button>
                <hr class="context-menu-sep">
                <button class="context-menu-item" @click="ctxCopyIoc()">📋 Copy IOC</button>
              </div>

            </div><!-- /threat-intel -->

            <!-- ── TI DASHBOARD (Variant B) ──────────────────────── -->
            <div x-show="page === 'ti-dashboard'" x-data="tiDashboardPage" x-init="init()">

              <!-- Breadcrumbs -->
              <div class="flex items-center gap-1 mb-4 text-sm" style="color:var(--text-muted);">
                <span>CSINT</span>
                <span style="margin:0 4px;">›</span>
                <span style="color:var(--accent-green);">TI Dashboard</span>
                <span x-show="dataLoading" class="spinner" style="width:12px;height:12px;margin-left:8px;"></span>
              </div>

              <!-- Loading dashboards -->
              <template x-if="loading">
                <div class="card text-center" style="color:var(--text-muted);padding:40px;">
                  <div class="spinner" style="width:24px;height:24px;margin:0 auto 12px;"></div>
                  <div>Loading dashboards…</div>
                </div>
              </template>

              <!-- No dashboards -->
              <template x-if="!loading && dashboards.length === 0">
                <div class="card text-center" style="color:var(--text-muted);padding:40px;">
                  <div style="font-size:32px;margin-bottom:12px;">📊</div>
                  <div>No dashboards found.</div>
                </div>
              </template>

              <!-- Dashboard selector (visible only when multiple dashboards exist) -->
              <template x-if="!loading && dashboards.length > 1">
                <div class="ti-db-selector">
                  <template x-for="d in dashboards" :key="d.id">
                    <button class="ti-db-tab"
                            :class="currentDashboard && currentDashboard.id === d.id ? 'active' : ''"
                            @click="selectDashboard(d)"
                            x-text="d.name"></button>
                  </template>
                </div>
              </template>

              <!-- Dashboard grid -->
              <template x-if="!loading && currentDashboard">
                <div>
                  <!-- Render rows (grouped by y coordinate) -->
                  <template x-for="(row, rowIdx) in widgetRows()" :key="rowIdx">
                    <div class="ti-dashboard-row">
                      <template x-for="widget in row" :key="widget.id">
                        <div :style="`grid-column: span ${widget._layout.w}`">

                          <!-- ── Widget: ti_stats ─────────────────── -->
                          <template x-if="widget.type === 'ti_stats'">
                            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
                              <div class="stat-card" style="cursor:default;">
                                <div class="stat-label">🔌 Active Sources</div>
                                <div class="stat-value text-green" x-text="statValue('active_sources')"></div>
                              </div>
                              <div class="stat-card" style="cursor:default;">
                                <div class="stat-label">🔎 Lookups (7d)</div>
                                <div class="stat-value" x-text="statValue('lookups_7d')"></div>
                              </div>
                              <div class="stat-card" style="cursor:default;">
                                <div class="stat-label">📋 History</div>
                                <div class="stat-value" x-text="statValue('history')"></div>
                              </div>
                              <div class="stat-card" style="cursor:default;">
                                <div class="stat-label">🆓 Free Sources</div>
                                <div class="stat-value text-green" x-text="statValue('free_connectors')"></div>
                              </div>
                            </div>
                          </template>

                          <!-- ── Widget: ti_quick_search ─────────── -->
                          <template x-if="widget.type === 'ti_quick_search'">
                            <div class="ti-widget-card">
                              <div class="ti-widget-title" x-text="widget.title || 'Quick IOC Search'"></div>
                              <div class="flex gap-2 flex-wrap">
                                <input class="form-input" type="text" x-model="qsIoc"
                                       placeholder="IP, domain, hash, URL, email…"
                                       style="flex:3;min-width:180px;" maxlength="512"
                                       @keyup.enter="runQuickSearch()" />
                                <select class="form-select" x-model="qsIocType" style="width:115px;">
                                  <template x-for="tp in iocTypes" :key="tp">
                                    <option :value="tp" x-text="tp.charAt(0).toUpperCase() + tp.slice(1)"></option>
                                  </template>
                                </select>
                                <button class="btn btn-primary" @click="runQuickSearch()"
                                        :disabled="qsLoading || !qsIoc.trim()" style="min-width:96px;">
                                  <span x-show="qsLoading" class="spinner" style="width:13px;height:13px;"></span>
                                  <span x-text="qsLoading ? 'Searching…' : '🔍 Search'"></span>
                                </button>
                                <button class="btn btn-secondary" x-show="qsResult || qsError"
                                        @click="clearQuickSearch()">✕ Clear</button>
                              </div>
                              <div x-show="qsError" class="alert alert-error text-sm mt-3" x-text="qsError"></div>
                              <!-- Quick result summary -->
                              <template x-if="qsResult && qsResult.normalized">
                                <div class="ti-qs-result">
                                  <div class="flex items-center gap-3">
                                    <div style="font-size:28px;line-height:1;" x-text="verdictIcon(qsResult.normalized.verdict)"></div>
                                    <div>
                                      <div style="font-weight:700;font-size:14px;" x-text="qsResult.ioc"></div>
                                      <div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;">
                                        <span class="ti-threat-badge"
                                              :class="'ti-threat-' + (qsResult.normalized.verdict || 'none')"
                                              x-text="(qsResult.normalized.verdict || 'unknown').toUpperCase()"></span>
                                        <span class="badge badge-gray" x-text="qsResult.ioc_type"></span>
                                      </div>
                                    </div>
                                    <template x-if="confidencePct(qsResult.normalized.confidence) !== null">
                                      <div style="margin-left:auto;text-align:right;">
                                        <div style="font-size:11px;color:var(--text-muted);">Confidence</div>
                                        <div style="font-weight:700;" x-text="confidencePct(qsResult.normalized.confidence) + '%'"></div>
                                      </div>
                                    </template>
                                  </div>
                                  <div x-show="qsResult.normalized.summary"
                                       class="text-sm mt-2"
                                       style="color:var(--text-secondary);"
                                       x-text="qsResult.normalized.summary"></div>
                                  <div class="mt-2">
                                    <button class="btn btn-sm btn-secondary" @click="navigate('threat-intel')">
                                      Open in TI Lookup →
                                    </button>
                                  </div>
                                </div>
                              </template>
                            </div>
                          </template>

                          <!-- ── Widget: ti_recent_lookups ───────── -->
                          <template x-if="widget.type === 'ti_recent_lookups'">
                            <div class="ti-widget-card">
                              <div class="ti-widget-title flex items-center justify-between">
                                <span x-text="widget.title || 'Recent Lookups'"></span>
                                <button class="btn btn-sm btn-secondary" @click="loadData()"
                                        title="Refresh" style="padding:2px 8px;">↺</button>

                          </div>
                        </div>
                        <div class="form-group">
                          <label class="form-label">Platforms</label>
                          <div class="flex gap-2" style="flex-wrap:wrap;">
                            <label class="badge badge-gray"><input type="checkbox" value="reddit" x-model="ruleForm.platforms" style="margin-right:6px;"><span>Reddit</span></label>
                            <label class="badge badge-gray"><input type="checkbox" value="rss" x-model="ruleForm.platforms" style="margin-right:6px;"><span>RSS</span></label>
                            <label class="badge badge-gray"><input type="checkbox" value="paste" x-model="ruleForm.platforms" style="margin-right:6px;"><span>Paste</span></label>
                            <label class="badge badge-gray"><input type="checkbox" value="twitter" x-model="ruleForm.platforms" style="margin-right:6px;"><span>X (Twitter)</span></label>
                            <label class="badge badge-gray"><input type="checkbox" value="telegram" x-model="ruleForm.platforms" style="margin-right:6px;"><span>Telegram</span></label>
                            <label class="badge badge-gray"><input type="checkbox" value="habrahabr" x-model="ruleForm.platforms" style="margin-right:6px;"><span>Habrahabr</span></label>
                          </div>
                        </div>
                        <div class="form-group">
                          <label class="form-label">Severity Threshold</label>
                          <select class="form-input" x-model.number="ruleForm.severity_threshold">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                          </select>
                        </div>
                        <div class="form-group">
                          <label class="form-label">Alert On</label>
                          <select class="form-input" x-model="ruleForm.alert_on">
                            <option value="EVERY_MENTION">EVERY_MENTION</option>
                            <option value="CLUSTER">CLUSTER</option>
                            <option value="SENTIMENT_SPIKE">SENTIMENT_SPIKE</option>
                          </select>
                        </div>
                        <div class="form-group">
                          <label class="form-label">Schedule (cron)</label>
                          <input class="form-input" x-model="ruleForm.schedule_cron" placeholder="*/15 * * * *" />
                        </div>
                        <div class="form-group">
                          <label class="form-label">Alert Email</label>
                          <input class="form-input" x-model="ruleForm.alert_email" placeholder="alerts@example.com" />
                        </div>
                        <div class="form-group">
                          <label class="form-label">Alert Telegram</label>
                          <input class="form-input" x-model="ruleForm.alert_telegram" placeholder="@channel_or_chat_id" />
                        </div>
                        <div class="form-group">
                          <label class="form-label">Store all mentions</label>
                          <select class="form-input" x-model="ruleForm.store_all">
                            <option :value="false">false</option>
                            <option :value="true">true</option>
                          </select>
                        </div>
                        <div class="form-group">
                          <label class="form-label">Active</label>
                          <select class="form-input" x-model="ruleForm.active">
                            <option :value="true">true</option>
                            <option :value="false">false</option>
                          </select>
                        </div>
                      </div>
                      <div class="modal-footer">
                        <button class="btn btn-secondary" @click="showRuleModal = false">Cancel</button>
                        <button class="btn btn-primary" @click="saveRule()">Save</button>
                      </div>
                    </div>
                  </div>
                </template>

                <template x-if="showQuickBrandModal">
                  <div class="modal-overlay" @click.self="showQuickBrandModal = false">
                    <div class="modal" style="max-width:460px;">
                      <div class="modal-header">
                        <div class="modal-title">Add new brand</div>
                        <button class="modal-close" @click="showQuickBrandModal = false">&times;</button>
                      </div>
                      <div class="modal-body">
                        <div class="form-group">
                          <label class="form-label">Brand name</label>
                          <input class="form-input" x-model="quickBrand.name" placeholder="Brand name" />
                        </div>
                        <div class="form-group">
                          <label class="form-label">Brand URL</label>
                          <input class="form-input" x-model="quickBrand.url" placeholder="https://example.com" />
                        </div>
                        <template x-if="quickBrandError">
                          <div class="alert alert-error" x-text="quickBrandError"></div>
                        </template>
                      </div>
                      <div class="modal-footer">
                        <button class="btn btn-secondary" @click="showQuickBrandModal = false">Cancel</button>
                        <button class="btn btn-primary" @click="saveQuickBrand()" :disabled="quickBrandLoading">
                          <span x-text="quickBrandLoading ? 'Saving…' : 'Save'"></span>
                        </button>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>

            <div x-show="page === 'logo-content-misuse'" x-data="logoMisusePage">

              <!-- Page header -->
              <div class="flex justify-between items-center mb-4">
                <h2 style="font-size:1.1rem;font-weight:600;color:var(--text-primary);margin:0;"
                    x-text="t('logo_content_misuse')"></h2>
                <div class="flex gap-2">
                  <button class="btn btn-secondary btn-sm" @click="exportCases('csv')">Export CSV</button>
                  <button class="btn btn-secondary btn-sm" @click="exportCases('json')">Export JSON</button>
                  <button class="btn btn-primary btn-sm" @click="showAddModal = true">+ Add Case</button>
                </div>
              </div>

              <!-- Stats row -->
              <div class="flex gap-2 mb-4" style="flex-wrap:wrap;">
                <div class="card" style="flex:1;min-width:130px;padding:16px;text-align:center;">
                  <div style="font-size:1.6rem;font-weight:700;" x-text="stats.total"></div>
                  <div class="text-muted" style="font-size:0.8rem;">Total Cases</div>
                </div>
                <div class="card" style="flex:1;min-width:130px;padding:16px;text-align:center;">
                  <div style="font-size:1.6rem;font-weight:700;color:var(--info);" x-text="stats.by_status.new || 0"></div>
                  <div class="text-muted" style="font-size:0.8rem;">New</div>
                </div>
                <div class="card" style="flex:1;min-width:130px;padding:16px;text-align:center;">
                  <div style="font-size:1.6rem;font-weight:700;color:var(--danger);" x-text="stats.by_status.confirmed || 0"></div>
                  <div class="text-muted" style="font-size:0.8rem;">Confirmed</div>
                </div>
                <div class="card" style="flex:1;min-width:130px;padding:16px;text-align:center;">
                  <div style="font-size:1.6rem;font-weight:700;color:var(--purple,#7c3aed);" x-text="stats.by_status.takedown_requested || 0"></div>
                  <div class="text-muted" style="font-size:0.8rem;">Takedown Sent</div>
                </div>
              </div>

              <!-- Two-column layout: brand logos | cases table -->
              <div style="display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start;">

                <!-- Left: Brand Logos panel -->
                <div class="card" style="padding:16px;">
                  <div style="font-weight:600;margin-bottom:12px;">Brand Logos</div>
                  <template x-if="brands.length === 0">
                    <div class="text-muted" style="font-size:0.85rem;">No brands found.</div>
                  </template>
                  <template x-for="brand in brands" :key="brand.id">
                    <div style="border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px;">
                      <div style="font-weight:500;margin-bottom:6px;" x-text="brand.name"></div>
                      <template x-if="brand.logo_path">
                        <div style="margin-bottom:6px;">
                          <img :src="'/api/v1/logo-misuse/brands/' + brand.id + '/logo'" alt="logo"
                               style="max-height:48px;max-width:100%;border-radius:4px;object-fit:contain;" />
                        </div>
                      </template>
                      <div class="flex gap-2" style="flex-wrap:wrap;">
                        <label class="btn btn-secondary btn-xs" style="cursor:pointer;">
                          <span x-text="uploadingLogo[brand.id] ? 'Uploading…' : 'Upload'"></span>
                          <input type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml"
                                 style="display:none;" @change="uploadLogo(brand.id, $event)" />
                        </label>
                        <button class="btn btn-secondary btn-xs" @click="openSearchModal(brand.id)">Search</button>
                        <template x-if="brand.logo_path">
                          <button class="btn btn-danger btn-xs" @click="deleteLogo(brand.id)">Delete</button>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>

                <!-- Right: filter bar + cases table -->
                <div>
                  <!-- Filter bar -->
                  <div class="flex gap-2 mb-3" style="flex-wrap:wrap;align-items:center;">
                    <select class="form-input" style="width:160px;" x-model="filterBrandId" @change="loadCases()">
                      <option value="">All Brands</option>
                      <template x-for="b in brands" :key="b.id">
                        <option :value="b.id" x-text="b.name"></option>
                      </template>
                    </select>
                    <select class="form-input" style="width:140px;" x-model="filterStatus" @change="loadCases()">
                      <option value="all">All Statuses</option>
                      <option value="new">New</option>
                      <option value="reviewing">Reviewing</option>
                      <option value="confirmed">Confirmed</option>
                      <option value="dismissed">Dismissed</option>
                      <option value="takedown_requested">Takedown Sent</option>
                    </select>
                    <select class="form-input" style="width:130px;" x-model="filterMatchType" @change="loadCases()">
                      <option value="all">All Types</option>
                      <option value="logo">Logo</option>
                      <option value="manual">Manual</option>
                    </select>
                    <input class="form-input" style="flex:1;min-width:160px;" type="text"
                           placeholder="Search URL / title…" x-model="filterQuery"
                           @input.debounce.400ms="loadCases()" />
                  </div>

                  <!-- Cases table -->
                  <div class="card" style="padding:0;overflow:hidden;">
                    <template x-if="loading">
                      <div style="padding:40px;text-align:center;" class="text-muted">Loading…</div>
                    </template>
                    <template x-if="!loading && cases.length === 0">
                      <div style="padding:40px;text-align:center;" class="text-muted">No cases found.</div>
                    </template>
                    <template x-if="!loading && cases.length > 0">
                      <div style="overflow-x:auto;">
                        <table class="table" style="width:100%;min-width:700px;">
                          <thead>
                            <tr>
                              <th style="width:50px;">Type</th>
                              <th>Source URL</th>
                              <th style="width:110px;">Brand</th>
                              <th style="width:90px;">Confidence</th>
                              <th style="width:120px;">Status</th>
                              <th style="width:100px;">Found</th>
                              <th style="width:160px;">Actions</th>
                            </tr>
                          </thead>
                          <tbody>
                            <template x-for="c in cases" :key="c.id">
                              <tr>
                                <td style="text-align:center;font-size:1.1rem;" :title="c.match_type" x-text="matchTypeIcon(c.match_type)"></td>
                                <td>
                                  <a :href="c.source_url" target="_blank" rel="noopener"
                                     style="color:var(--link);word-break:break-all;font-size:0.8rem;"
                                     x-text="c.source_url.length > 60 ? c.source_url.slice(0,60) + '…' : c.source_url"></a>
                                  <template x-if="c.page_title">
                                    <div class="text-muted" style="font-size:0.75rem;" x-text="c.page_title"></div>
                                  </template>
                                </td>
                                <td style="font-size:0.82rem;" x-text="brandName(c.brand_id)"></td>
                                <td>
                                  <span :style="confidenceColor(c.confidence)"
                                        x-text="(c.confidence * 100).toFixed(0) + '%'"></span>
                                </td>
                                <td>
                                  <span class="badge" :class="statusColor(c.status)"
                                        x-text="statusLabel(c.status)"></span>
                                </td>
                                <td class="text-muted" style="font-size:0.78rem;"
                                    x-text="c.created_at ? new Date(c.created_at).toLocaleDateString() : ''"></td>
                                <td>
                                  <div class="flex gap-2" style="flex-wrap:wrap;">
                                    <template x-if="c.status === 'new' || c.status === 'reviewing'">
                                      <button class="btn btn-secondary btn-xs"
                                              @click="updateCaseStatus(c.id, 'confirmed')">Confirm</button>
                                    </template>
                                    <template x-if="c.status === 'confirmed'">
                                      <button class="btn btn-secondary btn-xs"
                                              @click="requestTakedown(c.id)">Takedown</button>
                                    </template>
                                    <template x-if="c.status !== 'dismissed'">
                                      <button class="btn btn-secondary btn-xs"
                                              @click="dismissCase(c.id)">Dismiss</button>
                                    </template>
                                    <button class="btn btn-danger btn-xs"
                                            @click="deleteCase(c.id)">Delete</button>
                                  </div>
                                </td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </template>
                  </div>
                </div>
              </div>

              <!-- Search modal -->
              <template x-if="showSearchModal">
                <div class="modal-overlay" @click.self="showSearchModal = false">
                  <div class="modal" style="max-width:480px;">
                    <div class="modal-header">
                      <div class="modal-title">Search for Misuse</div>
                      <button class="modal-close" @click="showSearchModal = false">&times;</button>
                    </div>
                    <div class="modal-body">
                      <div class="form-group">
                        <label class="form-label">Search Query</label>
                        <input class="form-input" type="text" x-model="searchForm.query"
                               placeholder="Brand name or keywords…" />
                      </div>
                      <div class="form-group">
                        <label class="form-label">Max Results</label>
                        <input class="form-input" type="number" x-model.number="searchForm.max_results"
                               min="1" max="100" />
                      </div>
                      <template x-if="searchResults.length > 0">
                        <div style="margin-top:12px;">
                          <div style="font-weight:500;margin-bottom:6px;" x-text="searchResults.length + ' new cases found'"></div>
                          <template x-for="r in searchResults.slice(0,5)" :key="r.id">
                            <div style="font-size:0.8rem;padding:4px 0;border-bottom:1px solid var(--border);">
                              <a :href="r.source_url" target="_blank" rel="noopener"
                                 style="color:var(--link);" x-text="r.source_url.length > 60 ? r.source_url.slice(0,60) + '…' : r.source_url"></a>
                            </div>
                          </template>
                        </div>
                      </template>
                    </div>
                    <div class="modal-footer">
                      <button class="btn btn-secondary" @click="showSearchModal = false">Cancel</button>
                      <button class="btn btn-primary" @click="triggerSearch()" :disabled="searchLoading">
                        <span x-text="searchLoading ? 'Searching…' : 'Search'"></span>
                      </button>
                    </div>
                  </div>
                </div>
              </template>

              <!-- Add Case modal -->
              <template x-if="showAddModal">
                <div class="modal-overlay" @click.self="showAddModal = false">
                  <div class="modal" style="max-width:520px;">
                    <div class="modal-header">
                      <div class="modal-title">Add Misuse Case</div>
                      <button class="modal-close" @click="showAddModal = false">&times;</button>
                    </div>
                    <div class="modal-body">
                      <div class="form-group">
                        <label class="form-label">Brand</label>
                        <select class="form-input" x-model="newCase.brand_id" @change="onNewCaseBrandChange()">
                          <option value="">— select brand —</option>
                          <option value="__new__">＋ Add new brand</option>
                          <template x-for="b in brands" :key="b.id">
                            <option :value="b.id" x-text="b.name"></option>
                          </template>
                        </select>
                      </div>
                      <div class="form-group">
                        <label class="form-label">Source URL</label>
                        <input class="form-input" type="text" x-model="newCase.source_url"
                               placeholder="https://…" />
                      </div>
                      <div class="form-group">
                        <label class="form-label">Page Title</label>
                        <input class="form-input" type="text" x-model="newCase.page_title" />
                      </div>
                      <div class="form-group">
                        <label class="form-label">Match Type</label>
                        <select class="form-input" x-model="newCase.match_type">
                          <option value="logo">Logo</option>
                          <option value="manual">Manual</option>
                        </select>
                      </div>
                      <div class="form-group">
                        <label class="form-label">Confidence (0–1)</label>
                        <input class="form-input" type="number" x-model.number="newCase.confidence"
                               min="0" max="1" step="0.05" />
                      </div>
                      <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea class="form-input" x-model="newCase.description" rows="3"></textarea>
                      </div>
                    </div>
                    <div class="modal-footer">
                      <button class="btn btn-secondary" @click="showAddModal = false">Cancel</button>
                      <button class="btn btn-primary" @click="createCase()">Add Case</button>
                    </div>
                  </div>
                </div>
              </template>

              <template x-if="showQuickBrandModal">
                <div class="modal-overlay" @click.self="showQuickBrandModal = false">
                  <div class="modal" style="max-width:460px;">
                    <div class="modal-header">
                      <div class="modal-title">Add new brand</div>
                      <button class="modal-close" @click="showQuickBrandModal = false">&times;</button>
                    </div>
                    <div class="modal-body">
                      <div class="form-group">
                        <label class="form-label">Brand name</label>
                        <input class="form-input" x-model="quickBrand.name" placeholder="Brand name" />
                      </div>
                      <div class="form-group">
                        <label class="form-label">Brand URL</label>
                        <input class="form-input" x-model="quickBrand.url" placeholder="https://example.com" />
                      </div>
                      <template x-if="quickBrandError">
                        <div class="alert alert-error" x-text="quickBrandError"></div>
                      </template>
                    </div>
                    <div class="modal-footer">
                      <button class="btn btn-secondary" @click="showQuickBrandModal = false">Cancel</button>
                      <button class="btn btn-primary" @click="saveQuickBrand()" :disabled="quickBrandLoading">
                        <span x-text="quickBrandLoading ? 'Saving…' : 'Save'"></span>
                      </button>
                    </div>
                  </div>
                </div>
              </template>

            </div><!-- /logo-content-misuse -->

          </div><!-- /page-content (moved closing tag) -->
        </main>
      </div>
    </template>
  </div><!-- /app -->

  <script defer src="/static/js/lucide-init.js"></script>
</body>
</html>
