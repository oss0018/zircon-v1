                        <p class="text-muted text-sm">No folders yet. Upload a folder to get started.</p>
                      </template>
                    </div>
                  </template>
                  <template x-if="treeLoading">
                    <p class="text-muted text-sm">Loading...</p>
                  </template>
                  </div>
                </div>
              </div><!-- /tree tab -->

              <template x-if="useApiMode">
                <div class="mb-4">
                  <template x-if="error">
                    <div class="card mb-3" style="border:1px solid rgba(255,0,0,.25);padding:12px 14px;color:var(--danger);">
                      <strong>Error:</strong> <span x-text="error"></span>
                    </div>
                  </template>
                  <template x-if="loading">
                    <div class="card mb-3 text-muted text-sm" style="padding:12px 14px;">Loading Deep Search data…</div>
                  </template>
                </div>
              </template>

              <!-- ── TAB: Deep Search (API mode) ── -->
              <div x-show="useApiMode && activeTab==='search'">
                <div class="card mb-4">
                  <div class="card-title flex items-center gap-2">
                    Deep Search Query
                    <span x-show="loading" class="spinner" style="width:14px;height:14px;"></span>
                  </div>
                  <div class="flex gap-2 flex-wrap mb-3">
                    <input class="form-input" type="text" x-model="query"
                           placeholder="Search ingested chunks..."
                           style="flex:2;min-width:220px;"
                           maxlength="512"
                           @keyup.enter="runQuery()" />
                    <button class="btn btn-primary" @click="runQuery()" :disabled="loading">
                      <span x-text="loading ? 'Searching…' : 'Run query'"></span>
                    </button>
                    <button class="btn btn-secondary" @click="resetSearchFilters()">Reset filters</button>
                  </div>
                  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;">
                    <div class="form-group">
                      <label class="form-label">Severity min</label>
                      <input class="form-input" type="number" min="0" max="100" x-model="filterSeverityMin" />
                    </div>
                    <div class="form-group">
                      <label class="form-label">Severity max</label>
                      <input class="form-input" type="number" min="0" max="100" x-model="filterSeverityMax" />
                    </div>
                    <div class="form-group">
                      <label class="form-label">Has credentials</label>
                      <select class="form-select" x-model="filterHasCredentials">
                        <option value="">Any</option>
                        <option value="true">Yes</option>
                        <option value="false">No</option>
                      </select>
                    </div>
                    <div class="form-group">
                      <label class="form-label">Has PII</label>
                      <select class="form-select" x-model="filterHasPii">
                        <option value="">Any</option>
                        <option value="true">Yes</option>
                        <option value="false">No</option>
                      </select>
                    </div>
                    <div class="form-group">
                      <label class="form-label">Has API keys</label>
                      <select class="form-select" x-model="filterHasApiKeys">
                        <option value="">Any</option>
                        <option value="true">Yes</option>
                        <option value="false">No</option>
                      </select>
                    </div>
                    <div class="form-group">
                      <label class="form-label">Parse mode</label>
                      <input class="form-input" x-model="filterParseMode" placeholder="ocr, plaintext" />
                    </div>
                    <div class="form-group" style="grid-column:span 2;">
                      <label class="form-label">Pattern names</label>
                      <input class="form-input" x-model="filterPatternNames" placeholder="aws_access_key_id, email_address" />
                    </div>
                    <div class="form-group" style="grid-column:span 2;">
                      <label class="form-label">File path prefix</label>
                      <input class="form-input" x-model="filterFilePathPrefix" placeholder="/exports/" />
                    </div>
                  </div>
                </div>

                <div class="card" style="padding:0;">
                  <div class="flex justify-between items-center" style="padding:16px 16px 0;gap:8px;flex-wrap:wrap;">
                    <div class="card-title" style="margin-bottom:0;">Results</div>
                    <div class="text-muted text-sm" x-text="resultsTotal ? `Page ${resultsPage} • ${resultsTotal} hits` : 'Run a query to see results'"></div>
                  </div>
                  <div class="table-wrapper">
                    <table>
                      <thead>
                        <tr>
                          <th>Snippet</th>
                          <th>File path</th>
                          <th>Source</th>
                          <th>Chunk</th>
                          <th>Rank</th>
                          <th>Severity</th>
                          <th>Flags</th>
                          <th>Indexed</th>
                          <th>Actions</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-if="!loading && results.length === 0 && query.trim()">
                          <tr><td colspan="9" style="text-align:center;padding:24px;color:var(--text-muted);">No search results found.</td></tr>
                        </template>
                        <template x-if="!loading && results.length === 0 && !query.trim()">
                          <tr><td colspan="9" style="text-align:center;padding:24px;color:var(--text-muted);">Enter a query to search indexed chunks.</td></tr>
                        </template>
                        <template x-for="result in results" :key="`${result.chunk_id}-${result.file_id}`">
                          <tr>
                            <td style="max-width:340px;word-break:break-word;">
                              <div class="font-mono text-sm" x-text="result.snippet"></div>
                            </td>
                            <td style="max-width:220px;word-break:break-word;" x-text="result.file_path"></td>
                            <td x-text="result.source_id"></td>
                            <td x-text="result.chunk_index"></td>
                            <td x-text="Number(result.rank || 0).toFixed(3)"></td>
                            <td><span :class="severityBadgeClass(result.file_severity_max)" x-text="result.file_severity_max ?? '—'"></span></td>
                            <td>
                              <div class="flex gap-1" style="flex-wrap:wrap;">
                                <span :class="boolBadgeClass(result.file_has_credentials)" x-text="result.file_has_credentials ? 'Credentials' : 'No creds'"></span>
                                <span :class="boolBadgeClass(result.file_has_pii)" x-text="result.file_has_pii ? 'PII' : 'No PII'"></span>
                                <span :class="boolBadgeClass(result.file_has_api_keys)" x-text="result.file_has_api_keys ? 'API keys' : 'No keys'"></span>
                              </div>
                            </td>
                            <td x-text="formatDateTime(result.file_indexed_at)"></td>
                            <td>
                              <div class="flex gap-2">
                                <button class="btn btn-sm btn-primary" @click="openFile(result.file_id)">Open file</button>
                                <button class="btn btn-sm btn-secondary" @click="copySnippet(result.snippet)">Copy</button>
                              </div>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                  <div class="flex justify-between items-center" style="padding:12px 16px;gap:8px;flex-wrap:wrap;">
                    <button class="btn btn-sm btn-secondary" @click="runQuery(resultsPage - 1)" :disabled="loading || resultsPage <= 1">Previous</button>
                    <div class="text-muted text-sm" x-text="resultsTotal ? `Showing page ${resultsPage}` : 'No pages yet'"></div>
                    <button class="btn btn-sm btn-secondary" @click="runQuery(resultsPage + 1)" :disabled="loading || !resultsHasNext">Next</button>
                  </div>
                </div>
              </div><!-- /search tab api -->

              <!-- ── TAB: Leaks (API mode) ── -->
              <div x-show="useApiMode && activeTab==='leaks'">
                <div class="card mb-4">
                  <div class="card-title flex items-center gap-2">
                    Leak Listing
                    <span x-show="loading" class="spinner" style="width:14px;height:14px;"></span>
                  </div>
                  <div class="flex gap-2 flex-wrap mb-3">
                    <button class="btn btn-primary" @click="loadLeaks()" :disabled="loading">
                      <span x-text="loading ? 'Loading…' : 'Load leaks'"></span>
                    </button>
                    <button class="btn btn-secondary" @click="resetLeakFilters()">Reset filters</button>
                  </div>
                  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;">
                    <div class="form-group">
                      <label class="form-label">Category</label>
                      <input class="form-input" x-model="leakCategory" placeholder="api_keys" />
                    </div>
                    <div class="form-group">
                      <label class="form-label">Severity min</label>
                      <input class="form-input" type="number" min="0" max="100" x-model="filterSeverityMin" />
                    </div>
                    <div class="form-group" style="grid-column:span 2;">
                      <label class="form-label">File path prefix</label>
                      <input class="form-input" x-model="filterFilePathPrefix" placeholder="/exports/" />
                    </div>
                    <div class="form-group">
                      <label class="form-label">Detected after</label>
                      <input class="form-input" type="datetime-local" x-model="leakDetectedAfter" />
                    </div>
                    <div class="form-group">
                      <label class="form-label">Detected before</label>
                      <input class="form-input" type="datetime-local" x-model="leakDetectedBefore" />
                    </div>
                  </div>
                </div>

                <div class="card" style="padding:0;">
                  <div class="flex justify-between items-center" style="padding:16px 16px 0;gap:8px;flex-wrap:wrap;">
                    <div class="card-title" style="margin-bottom:0;">Leaks</div>
                    <div class="text-muted text-sm" x-text="leaksTotal ? `Page ${leaksPage} • ${leaksTotal} records` : 'No leaks loaded yet'"></div>
                  </div>
                  <div class="table-wrapper">
                    <table>
                      <thead>
                        <tr>
                          <th>Pattern</th>
                          <th>Category</th>
                          <th>Severity</th>
                          <th>Masked value</th>
                          <th>File path</th>
                          <th>Source</th>
                          <th>Line</th>
                          <th>Detected</th>
                          <th>Actions</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-if="!loading && leaks.length === 0">
                          <tr><td colspan="9" style="text-align:center;padding:24px;color:var(--text-muted);">No leaks found for the current filters.</td></tr>
                        </template>
                        <template x-for="leak in leaks" :key="leak.leak_id">
                          <tr>
                            <td x-text="leak.pattern_name"></td>
                            <td x-text="leak.category"></td>
                            <td><span :class="severityBadgeClass(leak.severity)" x-text="leak.severity"></span></td>
                            <td style="max-width:220px;word-break:break-word;" x-text="leak.matched_value_masked"></td>
                            <td style="max-width:220px;word-break:break-word;" x-text="leak.file_path"></td>
                            <td x-text="leak.source_id"></td>
                            <td x-text="leak.line_number ?? '—'"></td>
                            <td x-text="formatDateTime(leak.detected_at)"></td>
                            <td>
                              <div class="flex gap-2">
                                <button class="btn btn-sm btn-primary" @click="openFile(leak.file_id)">Open file</button>
                                <button class="btn btn-sm btn-secondary" @click="copyMaskedValue(leak.matched_value_masked)">Copy</button>
                              </div>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                  <div class="flex justify-between items-center" style="padding:12px 16px;gap:8px;flex-wrap:wrap;">
                    <button class="btn btn-sm btn-secondary" @click="loadLeaks(leaksPage - 1)" :disabled="loading || leaksPage <= 1">Previous</button>
                    <div class="text-muted text-sm" x-text="leaksTotal ? `Showing page ${leaksPage}` : 'No pages yet'"></div>
                    <button class="btn btn-sm btn-secondary" @click="loadLeaks(leaksPage + 1)" :disabled="loading || !leaksHasNext">Next</button>
                  </div>
                </div>
              </div><!-- /leaks tab api -->

              <!-- ── TAB: File (API mode) ── -->
              <div x-show="useApiMode && activeTab==='file'">
                <template x-if="!selectedFile && !loading">
                  <div class="card text-muted text-sm text-center" style="padding:40px;">
                    <div style="font-size:32px;margin-bottom:12px;">📄</div>
                    <div>Open a file from search results or leaks to view file details.</div>
                  </div>
                </template>
                <template x-if="selectedFile">
                  <div>
                    <div class="card mb-3">
                      <div class="card-title">File metadata</div>
                      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;">
                        <div><span class="text-muted">Path:</span> <span x-text="selectedFile.file.file_path || '—'"></span></div>
                        <div><span class="text-muted">Source ID:</span> <span x-text="selectedFile.file.source_id ?? '—'"></span></div>
                        <div><span class="text-muted">Parse mode:</span> <span x-text="selectedFile.file.parse_mode || '—'"></span></div>
                        <div><span class="text-muted">Indexed:</span> <span x-text="formatDateTime(selectedFile.file.indexed_at)"></span></div>
                        <div><span class="text-muted">Severity max:</span> <span :class="severityBadgeClass(selectedFile.file.severity_max)" x-text="selectedFile.file.severity_max ?? '—'"></span></div>
                        <div><span class="text-muted">Patterns:</span> <span x-text="(selectedFile.file.pattern_names || []).join(', ') || '—'"></span></div>
                      </div>
                    </div>

                    <div class="card mb-3">
                      <div class="card-title">Leak summary</div>
                      <div class="flex gap-2 mb-3" style="flex-wrap:wrap;">
                        <span class="badge badge-blue" x-text="`Total ${selectedFile.leak_summary.total || 0}`"></span>
                        <span :class="severityBadgeClass(selectedFile.leak_summary.severity_max)" x-text="`Severity ${selectedFile.leak_summary.severity_max ?? '—'}`"></span>
                      </div>
                      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;">
                        <div>
                          <div class="text-muted text-sm" style="margin-bottom:6px;">By pattern</div>
                          <template x-if="Object.keys(selectedFile.leak_summary.by_pattern || {}).length === 0">
                            <div class="text-muted text-sm">No leak patterns.</div>
                          </template>
                          <template x-for="[name, count] in Object.entries(selectedFile.leak_summary.by_pattern || {})" :key="name">
                            <div class="text-sm"><span x-text="name"></span>: <span x-text="count"></span></div>
                          </template>
                        </div>
                        <div>
                          <div class="text-muted text-sm" style="margin-bottom:6px;">By category</div>
                          <template x-if="Object.keys(selectedFile.leak_summary.by_category || {}).length === 0">
                            <div class="text-muted text-sm">No leak categories.</div>
                          </template>
                          <template x-for="[name, count] in Object.entries(selectedFile.leak_summary.by_category || {})" :key="name">
                            <div class="text-sm"><span x-text="name"></span>: <span x-text="count"></span></div>
                          </template>
                        </div>
                      </div>
                    </div>

                    <div class="card mb-3">
                      <div class="card-title">Chunk preview</div>
                      <template x-if="(selectedFile.chunks_preview || []).length === 0">
                        <div class="text-muted text-sm">No preview chunks available.</div>
                      </template>
                      <div class="flex flex-col gap-2">
                        <template x-for="chunk in (selectedFile.chunks_preview || [])" :key="chunk.chunk_id">
                          <div style="border:1px solid var(--border-color);border-radius:10px;padding:10px 12px;">
                            <div class="flex justify-between items-center gap-2 mb-2">
                              <span class="badge badge-gray" x-text="`Chunk ${chunk.chunk_index}`"></span>
                              <button class="btn btn-sm btn-secondary" @click="copySnippet(chunk.snippet)">Copy</button>
                            </div>
                            <div class="font-mono text-sm" style="white-space:pre-wrap;word-break:break-word;" x-text="chunk.snippet"></div>
                          </div>
                        </template>
                      </div>
                    </div>

                    <div class="card" style="padding:0;">
                      <div class="flex justify-between items-center" style="padding:16px 16px 0;gap:8px;flex-wrap:wrap;">
                        <div class="card-title" style="margin-bottom:0;">All chunks</div>
                        <div class="text-muted text-sm" x-text="selectedFileChunksTotal ? `${selectedFileChunks.length} of ${selectedFileChunksTotal} loaded` : 'No chunks loaded'"></div>
                      </div>
                      <div class="table-wrapper">
                        <table>
                          <thead>
                            <tr>
                              <th>Chunk</th>
                              <th>Offsets</th>
                              <th>Content</th>
                              <th>Actions</th>
                            </tr>
                          </thead>
                          <tbody>
                            <template x-if="selectedFileChunks.length === 0">
                              <tr><td colspan="4" style="text-align:center;padding:24px;color:var(--text-muted);">No chunks available for this file.</td></tr>
                            </template>
                            <template x-for="chunk in selectedFileChunks" :key="chunk.chunk_id">
                              <tr>
                                <td x-text="chunk.chunk_index"></td>
                                <td x-text="`${chunk.start_offset} - ${chunk.end_offset}`"></td>
                                <td style="max-width:520px;word-break:break-word;"><div class="font-mono text-sm" style="white-space:pre-wrap;" x-text="chunk.content"></div></td>
                                <td><button class="btn btn-sm btn-secondary" @click="copySnippet(chunk.content)">Copy</button></td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                      <div class="flex justify-end" style="padding:12px 16px;">
                        <button class="btn btn-sm btn-secondary"
                                @click="loadFileChunks(selectedFile.file.id, selectedFileChunksOffset)"
                                :disabled="loading || !selectedFileChunksHasNext">
                          <span x-text="selectedFileChunksHasNext ? 'Load more chunks' : 'All chunks loaded'"></span>
                        </button>
                      </div>
                    </div>
                  </div>
                </template>
              </div><!-- /file tab api -->

              <!-- ── TAB: Deep Search (legacy mode) ── -->
              <div x-show="!useApiMode && activeTab==='search'">
                <div class="card mb-4">
                  <div class="card-title flex items-center gap-2">
                    Search in Files
                    <span x-show="searchLoading" class="spinner" style="width:14px;height:14px;"></span>
                  </div>
                  <!-- Query + folder selector row -->
                  <div class="flex gap-2 flex-wrap mb-2">
                    <input class="form-input" type="text" x-model="searchQuery"
                           placeholder="domain, email, IP, keyword..." style="flex:2;min-width:200px;"
                           @keyup.enter="runSearch()"
                           @input="debouncedSearch()"
                           maxlength="512" />
                    <select class="form-select" x-model="searchFolder" style="width:180px;">
                      <option value="">All folders</option>
                      <template x-for="f in folders" :key="f.name">
                        <option :value="f.name" x-text="f.name"></option>
                      </template>
                    </select>
                    <button class="btn btn-primary" @click="runSearch()" :disabled="searchLoading">
                      <span x-text="searchLoading ? 'Searching...' : 'Search'"></span>
                    </button>
                  </div>
                  <!-- Client-side filters (shown only after results) -->
                  <template x-if="_allResults.length > 0">
                    <div class="flex gap-2 flex-wrap items-center mt-2" style="border-top:1px solid var(--border-color);padding-top:8px;">
                      <select class="form-select" x-model="filterExt" style="width:130px;" title="Filter by file type">
                        <option value="">All types</option>
                        <template x-for="ext in availableExtensions()" :key="ext">
                          <option :value="ext" x-text="ext"></option>
                        </template>
                      </select>
                      <select class="form-select" x-model="filterFolder" style="width:160px;" title="Filter by folder">
                        <option value="">All folders</option>
                        <template x-for="fld in availableFolders()" :key="fld">
                          <option :value="fld" x-text="fld"></option>
                        </template>
                      </select>
                      <button class="btn btn-sm btn-secondary" @click="clearFilters()"
                              x-show="filterExt || filterFolder">✕ Clear filters</button>
                      <span class="text-xs text-muted" style="margin-left:auto;"
                            x-text="(() => { const fc = filteredCount(), tc = totalCount(), vc = visibleResults().length; return 'Showing ' + vc + ' of ' + fc + (fc !== tc ? ' (filtered from ' + tc + ')' : ''); })()"></span>
                    </div>
                  </template>
                </div>

                <!-- Stats -->
                <template x-if="searchStats">
                  <div class="flex gap-3 mb-3">
                    <span class="badge badge-green" x-text="searchStats.total_matches + ' matches'"></span>
                    <span class="badge badge-gray" x-text="searchStats.total_files + ' files'"></span>
                  </div>
                </template>

                <!-- Results (virtualised: only renders up to _visibleCount items) -->
                <template x-for="result in visibleResults()" :key="result.file_path">
                  <div class="card mb-2" style="padding:0;overflow:hidden;">
                    <div style="background:var(--bg-secondary);padding:8px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-color);">
                      <div class="flex items-center gap-2 cursor-pointer" @click="toggleResultExpand(result.file_path)">
                        <span style="color:var(--text-muted);font-size:10px;" x-text="isResultExpanded(result.file_path) ? '▼' : '▶'"></span>
                        <span>📄</span>
                        <span class="font-mono text-sm text-green" x-html="highlightFileName(result.file_name)"></span>
                        <span class="badge badge-gray text-xs" x-text="result.match_count + ' matches'"></span>
                      </div>
                      <div class="flex gap-2 items-center">
                        <span class="text-xs text-muted truncate" x-text="result.file_path" style="max-width:200px;"></span>
                        <button class="btn btn-sm btn-secondary" @click="openFileFromSearch(result.file_path)">Open</button>
                        <button class="btn btn-sm btn-secondary" @click="downloadSearchResult(result.file_path)"
                                x-text="isAdminUser ? 'Download' : 'Download (watermark)'"></button>
                      </div>
                    </div>
                    <div x-show="isResultExpanded(result.file_path)" style="font-family:'JetBrains Mono',monospace;font-size:12px;">
                      <template x-for="m in result.matches" :key="m.line + m.text">
                        <div class="grep-line" style="display:flex;gap:8px;padding:4px 14px;border-bottom:1px solid rgba(255,255,255,0.03);">
                          <span style="color:var(--text-muted);min-width:50px;" x-text="m.line > 0 ? m.line + ':' : '[name]'"></span>
                          <span style="flex:1;word-break:break-all;" x-html="highlightMatch(m.text)"></span>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>

                <!-- Sentinel for Intersection Observer (loads more results on scroll) -->
                <div id="ds-results-sentinel" style="height:1px;"></div>

                <template x-if="filteredCount() === 0 && searchStats !== null">
                  <div class="card text-center" style="color:var(--text-muted);padding:40px;">
                    <div style="font-size:32px;margin-bottom:12px;">🔍</div>
                    <div>No results found for "<span x-text="searchQuery"></span>"</div>
                  </div>
                </template>
              </div><!-- /search tab -->

              <!-- ── TAB: File Viewer ── -->
              <div x-show="!useApiMode && activeTab==='viewer'">
                <template x-if="viewerLoading">
                  <div class="card text-muted text-sm text-center" style="padding:40px;">Loading file...</div>
                </template>
                <template x-if="!viewerLoading && !viewerFile">
                  <div class="card text-muted text-sm text-center" style="padding:40px;">
                    <div style="font-size:32px;margin-bottom:12px;">📄</div>
                    <div>Click a file in the tree to view its contents</div>
                  </div>
                </template>
                <template x-if="!viewerLoading && viewerFile">
                  <div>
                    <!-- Breadcrumbs -->
                    <div class="flex items-center gap-1 mb-3 text-sm" style="flex-wrap:wrap;">
                      <template x-for="(crumb, i) in viewerBreadcrumbs()" :key="crumb + i">
                        <span>
                          <span x-show="i > 0" style="color:var(--text-muted);"> › </span>
                          <span :style="i === viewerBreadcrumbs().length - 1 ? 'color:var(--accent-green)' : 'color:var(--text-muted)'"
                                x-text="crumb"></span>
                        </span>
                      </template>
                    </div>

                    <!-- File meta -->
                    <div class="card mb-3" style="padding:10px 14px;">
                      <div class="flex gap-4 flex-wrap text-sm">
                        <span><span class="text-muted">Name:</span> <span class="text-green" x-text="viewerFile.path.split('/').pop()"></span></span>
                        <span><span class="text-muted">Size:</span> <span x-text="formatSize(viewerFile.size)"></span></span>
                        <span x-show="viewerFile.ext"><span class="text-muted">Ext:</span> <span x-text="viewerFile.ext"></span></span>
                        <span x-show="!viewerFile.binary && viewerFile.lines_total"><span class="text-muted">Lines:</span> <span x-text="viewerFile.lines_total"></span></span>
                        <span x-show="viewerFile.truncated" class="badge badge-gray">Truncated (500 lines)</span>
                      </div>
                    </div>

                    <!-- Actions -->
                    <div class="flex gap-2 mb-3">
                      <button class="btn btn-secondary btn-sm" @click="copyViewerContent()" x-show="!viewerFile.binary">
                        <span x-text="viewerCopied ? '✅ Copied' : '📋 Copy'"></span>
                      </button>
                      <button class="btn btn-secondary btn-sm" @click="searchInThisFile()">🔍 Search in this file</button>
                    </div>

                    <!-- Binary notice -->
                    <template x-if="viewerFile.binary">
                      <div class="card text-muted text-sm text-center" style="padding:30px;">
                        [Binary file — preview not available] Size: <span x-text="formatSize(viewerFile.size)"></span>
                      </div>
                    </template>

                    <!-- CSV table -->
                    <template x-if="!viewerFile.binary && isCSV()">
                      <div class="card" style="overflow-x:auto;max-height:500px;">
                        <table class="table" style="font-size:12px;">
                          <tbody>
                            <template x-for="(row, ri) in csvRows()" :key="ri">
                              <tr>
                                <template x-for="(cell, ci) in row" :key="ci">
                                  <td x-text="cell"></td>
                                </template>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </template>

                    <!-- Text/JSON content -->
                    <template x-if="!viewerFile.binary && !isCSV()">
                      <div class="card" style="overflow:auto;max-height:600px;padding:0;">
                        <pre class="code-block" style="margin:0;white-space:pre-wrap;word-break:break-all;font-size:12px;"
                             x-text="renderFileContent()"></pre>
                      </div>
                    </template>
                  </div>
                </template>
              </div><!-- /viewer tab -->

              <!-- ── Context Menu ── -->
              <div class="context-menu" x-show="ctxMenu.show"
                   :style="`left:${ctxMenu.x}px;top:${ctxMenu.y}px;`"
                   @click.stop>
                <button class="context-menu-item" @click="ctxOpen()">📄 Open</button>
                <button class="context-menu-item" @click="ctxOpenNewTab()"
                        x-show="ctxMenu.item && ctxMenu.item.type==='file'">🔗 Open in new tab</button>
                <button class="context-menu-item" @click="ctxCopyPath()">📋 Copy path</button>
                <hr class="context-menu-sep">
                <button class="context-menu-item" @click="ctxDownload()"
                        x-show="ctxMenu.item && ctxMenu.item.type==='file'" x-text="isAdminUser ? '⬇️ Download' : '⬇️ Download (watermark)'"></button>
                <button class="context-menu-item danger" @click="ctxDelete()" x-show="isAdminUser">🗑️ Delete</button>
              </div>

            </div><!-- /deep-search -->

            <!-- ── THREAT INTELLIGENCE ───────────────────────── -->
            <div x-show="page === 'threat-intel'" x-data="threatIntelPage" x-init="init()">

              <!-- Breadcrumbs -->
              <div class="flex items-center gap-1 mb-4 text-sm" style="color:var(--text-muted);">
                <span>CSINT</span>
                <span style="margin:0 4px;">›</span>
                <span style="color:var(--accent-green);">Threat Intelligence</span>
              </div>

              <!-- Stats row (always visible) -->
              <div class="stats-grid" style="margin-bottom:16px;">
                <div class="stat-card">
                  <div class="stat-label">🔌 Active Sources</div>
                  <div class="stat-value text-green" x-text="stats ? stats.active_ti_integrations : activeIntegrations.length"></div>
                </div>
                <div class="stat-card">
                  <div class="stat-label">🔎 Lookups (7 days)</div>
                  <div class="stat-value" x-text="stats ? stats.total_lookups_7d : '—'"></div>
                </div>
                <div class="stat-card">
                  <div class="stat-label">📋 History entries</div>
                  <div class="stat-value" x-text="history.length"></div>
                </div>
                <div class="stat-card">
                  <div class="stat-label">🆓 Free connectors</div>
                  <div class="stat-value text-green">4</div>
                </div>
              </div>

              <!-- Dashboard charts row -->
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;">
                <!-- Source distribution doughnut -->
                <div class="card">
                  <div class="card-title">🍩 Lookups by Source (7 days)</div>
                  <!-- Loading -->
                  <div x-show="statsLoading" style="height:200px;display:flex;align-items:center;justify-content:center;">
                    <span class="spinner" style="width:22px;height:22px;"></span>
                  </div>
                  <!-- Empty -->
                  <div x-show="!statsLoading && !hasSourceStats()"
                       style="height:200px;display:flex;align-items:center;justify-content:center;">
                    <p class="text-muted text-sm">No lookups in the past 7 days.</p>
                  </div>
                  <!-- Chart canvas (always in DOM; only visible when data exists) -->
                  <div x-show="!statsLoading && hasSourceStats()"
                       style="height:200px;position:relative;">
                    <canvas id="ti-summary-chart"></canvas>
                  </div>
                </div>
                <!-- Top sources bar -->
                <div class="card">
                  <div class="card-title">📊 Top Sources (7 days)</div>
                  <!-- Loading -->
                  <div x-show="statsLoading" style="height:200px;display:flex;align-items:center;justify-content:center;">
                    <span class="spinner" style="width:22px;height:22px;"></span>
                  </div>
                  <!-- Empty -->
                  <div x-show="!statsLoading && !hasSourceStats()"
                       style="height:200px;display:flex;align-items:center;justify-content:center;">
                    <p class="text-muted text-sm">No source data for the past 7 days.</p>
                  </div>
                  <!-- Chart canvas (always in DOM; only visible when data exists) -->
                  <div x-show="!statsLoading && hasSourceStats()"
                       style="height:200px;position:relative;">
                    <canvas id="ti-top-sources-bar"></canvas>
                  </div>
                </div>
              </div>

              <!-- ── IOC SEARCH FORM ─────────────────────────── -->
              <div class="card" style="margin-bottom:16px;">
                <div class="card-title">🔎 IOC Search</div>

                <!-- Search bar row -->
                <div class="flex gap-2 flex-wrap mb-3">
                  <div style="flex:3;min-width:220px;position:relative;">
                    <input class="form-input" type="text" x-model="iocForm.ioc"
                           placeholder="Enter IP, domain, hash, URL, email..."
                           style="width:100%;padding-right:36px;" maxlength="512"
                           @keyup.enter="runSearch()" />
                  </div>
                  <select class="form-select" x-model="iocForm.ioc_type" style="width:130px;">
                    <template x-for="t in iocTypes" :key="t">
                      <option :value="t" x-text="t.charAt(0).toUpperCase() + t.slice(1)"></option>
                    </template>
                  </select>
                  <button class="btn btn-primary" @click="runSearch()"
                          :disabled="lookupLoading || !iocForm.ioc.trim()"
                          style="min-width:100px;">
                    <span x-show="lookupLoading" class="spinner" style="width:14px;height:14px;"></span>
                    <span x-text="lookupLoading ? 'Searching…' : '🔍 Search'"></span>
                  </button>
                </div>

                <!-- Source selection -->
                <div>
                  <div class="flex items-center gap-2 mb-2" style="font-size:12px;color:var(--text-muted);">
                    <span>Sources:</span>
                    <label class="flex items-center gap-1" style="cursor:pointer;">
                      <input type="checkbox" x-model="selectAllSources" @change="toggleSelectAll()"
                             style="accent-color:var(--accent-green);" />
                      <span style="color:var(--text-secondary);font-weight:600;">All sources</span>
                    </label>
                  </div>
                  <div class="ti-source-grid">
                    <template x-for="src in activeIntegrations" :key="src.service_type">
                      <label class="ti-source-chip"
                             :class="[selectedSources.includes(src.service_type) ? 'selected' : '', src.free ? 'free-badge' : '']">
                        <input type="checkbox" :value="src.service_type"
                               x-model="selectedSources" @change="onSourceToggle()"
                               style="display:none;" />
                        <span x-text="src.name"></span>
                      </label>
                    </template>
                  </div>
                </div>

                <!-- Error -->
                <template x-if="lookupError">
                  <div class="alert alert-error mt-2" style="font-size:12px;" x-text="lookupError"></div>
                </template>
              </div>

              <!-- ── SEARCH RESULTS ─────────────────────────── -->
              <template x-if="searchResult && normalized">
                <div>

                  <!-- Summary card -->
                  <div class="ti-summary-card mb-3"
                       :class="'verdict-' + normalized.verdict">
                    <div class="flex items-start gap-4">
                      <!-- Verdict icon -->
                      <div class="ti-verdict-icon" x-text="verdictIcon(normalized.verdict)"></div>
                      <!-- Main info -->
                      <div style="flex:1;min-width:0;">
                        <div class="flex items-center gap-3 flex-wrap mb-2">
                          <span style="font-size:17px;font-weight:700;color:var(--text-primary);font-family:monospace;" x-text="searchResult.ioc"></span>
                          <span class="badge badge-gray" x-text="searchResult.ioc_type"></span>
                          <span class="ti-sev-badge" :class="severityClass(normalized.severity)"
                                x-text="severityLabel(normalized.severity)"></span>
                        </div>
                        <!-- Summary text -->
                        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:10px;" x-text="normalized.summary"></div>
                        <!-- Confidence bar -->
                        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
                          <span style="font-size:11px;color:var(--text-muted);flex-shrink:0;">Confidence</span>
                          <div class="ti-confidence-bar" style="max-width:180px;">
                            <div class="ti-confidence-fill"
                                 :style="`width:${normalized.confidence}%;background:${confidenceColor(normalized.confidence)}`"></div>
                          </div>
                          <span style="font-size:11px;font-weight:700;" :style="`color:${confidenceColor(normalized.confidence)}`"
                                x-text="normalized.confidence + '%'"></span>
                        </div>
                        <!-- Sources hit + tags -->
                        <div class="flex gap-2 flex-wrap">
                          <template x-if="normalized.sources_hit && normalized.sources_hit.length > 0">
                            <div class="flex gap-1 flex-wrap items-center">
                              <span style="font-size:11px;color:var(--text-muted);">Detected by:</span>
                              <template x-for="src in normalized.sources_hit" :key="src">
                                <span class="badge badge-red text-xs" x-text="src"></span>
                              </template>
                            </div>
                          </template>
                          <template x-if="normalized.tags && normalized.tags.length > 0">
                            <div class="flex gap-1 flex-wrap items-center">
                              <span style="font-size:11px;color:var(--text-muted);">Tags:</span>
                              <template x-for="tag in normalized.tags.slice(0,8)" :key="tag">
                                <span class="badge badge-gray text-xs" x-text="tag"></span>
                              </template>
                              <span x-show="normalized.tags.length > 8" class="badge badge-gray text-xs"
                                    x-text="'+' + (normalized.tags.length - 8) + ' more'"></span>
                            </div>
                          </template>
                        </div>
                      </div>
                      <!-- Queried at -->
                      <div style="text-align:right;flex-shrink:0;">
                        <div style="font-size:10px;color:var(--text-muted);">Queried at</div>
                        <div style="font-size:11px;color:var(--text-secondary);" x-text="formatDate(searchResult.queried_at)"></div>
                        <div style="font-size:10px;color:var(--text-muted);margin-top:4px;" x-text="perSource.length + ' source(s)'"></div>
                      </div>
                    </div>
                  </div>

                  <!-- Result tabs -->
                  <div class="ti-tabs">
                    <button class="ti-tab" :class="activeResultTab === 'summary' ? 'active' : ''"
                            @click="activeResultTab = 'summary'">
                      📋 Summary
                    </button>
                    <button class="ti-tab" :class="activeResultTab === 'detections' ? 'active' : ''"
                            @click="activeResultTab = 'detections'"
                            x-show="hasDetections">
                      🛡️ Detections
                      <span class="ti-tab-badge" x-text="normalized.detections.length"></span>
                    </button>
                    <button class="ti-tab" :class="activeResultTab === 'enrichment' ? 'active' : ''"
                            @click="activeResultTab = 'enrichment'"
                            x-show="hasEnrichment">
                      🌐 Enrichment
                    </button>
                    <button class="ti-tab" :class="activeResultTab === 'artifacts' ? 'active' : ''"
                            @click="activeResultTab = 'artifacts'"
                            x-show="hasArtifacts">
                      🔗 Artifacts
                    </button>
                    <button class="ti-tab" :class="activeResultTab === 'timeline' ? 'active' : ''"
                            @click="activeResultTab = 'timeline'"
                            x-show="hasTimeline">
                      📅 Timeline
                      <span class="ti-tab-badge" x-text="normalized.timeline.length"></span>
                    </button>
                    <button class="ti-tab" :class="activeResultTab === 'sources' ? 'active' : ''"
                            @click="activeResultTab = 'sources'">
                      🔍 Sources
                      <span class="ti-tab-badge" x-text="perSource.length"></span>
                    </button>
                  </div>

                  <!-- Tab: Summary (per-source overview) -->
                  <div x-show="activeResultTab === 'summary'">
                    <!-- Tags cloud (if any tags) -->
                    <template x-if="normalized.tags && normalized.tags.length > 0">
                      <div class="card mb-3" style="padding:14px 16px;">
                        <div class="card-title" style="margin-bottom:8px;">Tags</div>
                        <div class="flex gap-2 flex-wrap">
                          <template x-for="tag in normalized.tags" :key="tag">
                            <span :class="'ti-tag-badge ' + tagBadgeClass(tag)" x-text="tag"></span>
                          </template>
                        </div>
                      </div>
                    </template>

                    <!-- Source cards grid -->
                    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;">
                      <template x-for="src in perSource" :key="src.source">
                        <div class="ti-result-card"
                             :class="[
                               src.error ? 'ti-threat-error has-error' : '',
                               src.source === 'virustotal' ? 'ti-source-virustotal' :
                               src.source === 'abuseipdb' ? 'ti-source-abuseipdb' :
                               src.source === 'alienvault' ? 'ti-source-alienvault' :
                               src.source === 'shodan' ? 'ti-source-shodan' :
                               src.source === 'malwarebazaar' ? 'ti-source-malwarebazaar' :
                               src.source === 'threatfox' ? 'ti-source-threatfox' :
                               src.source === 'urlhaus' ? 'ti-source-urlhaus' :
                               src.source === 'hibp' ? 'ti-source-hibp' :
                               src.source === 'censys' ? 'ti-source-censys' :
                               src.source === 'urlscan' ? 'ti-source-urlscan' :
                               src.source === 'securitytrails' ? 'ti-source-securitytrails' : ''
                             ]">
                          <!-- Card header -->
                          <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-2">
                              <span style="font-weight:700;font-size:13px;" x-text="src.name"></span>
                              <template x-if="src.free">
                                <span style="font-size:9px;padding:1px 5px;border-radius:4px;background:rgba(0,180,216,0.15);color:#38bdf8;font-weight:700;">FREE</span>
                              </template>
                              <a :href="src.url" target="_blank" rel="noopener noreferrer"
                                 class="badge badge-gray text-xs" style="text-decoration:none;">&#x2197;</a>
                            </div>
                            <button class="btn btn-sm btn-secondary" style="font-size:10px;padding:2px 7px;"
                                    @click="openRaw(src.name, src.data)">Raw JSON</button>
                          </div>

                          <!-- Error / not found states -->
                          <template x-if="src.error">
                            <div style="font-size:11px;color:#f87171;" x-text="src.error"></div>
                          </template>
                          <template x-if="!src.error && (!src.data || src.data.not_found)">
                            <div style="font-size:11px;color:var(--text-muted);">No data found for this IOC</div>
                          </template>

                          <!-- VirusTotal smart card -->
                          <template x-if="!src.error && src.data && !src.data.not_found && src.source === 'virustotal'">
                            <div>
                              <template x-if="vtStatsBreakdown(src.data)">
                                <div>
                                  <div class="flex items-center gap-3 mb-2">
                                    <span style="font-size:22px;font-weight:900;"
                                          :style="`color:${vtStatsBreakdown(src.data).malicious > 0 ? '#ff4444' : vtStatsBreakdown(src.data).suspicious > 0 ? '#ff9900' : '#00cc66'}`"
                                          x-text="vtStatsBreakdown(src.data).malicious + '/' + vtStatsBreakdown(src.data).total"></span>
                                    <span style="font-size:11px;color:var(--text-muted);">engines detected</span>
                                  </div>
                                  <div class="ti-detection-bar mb-2">
                                    <div class="ti-detection-bar-mal" :style="`width:${vtStatsBreakdown(src.data).malPct}%`"></div>
                                    <div class="ti-detection-bar-sus" :style="`width:${vtStatsBreakdown(src.data).susPct}%`"></div>
                                    <div class="ti-detection-bar-clean" :style="`width:${vtStatsBreakdown(src.data).cleanPct}%`"></div>
                                    <div class="ti-detection-bar-unk" :style="`width:${vtStatsBreakdown(src.data).unkPct}%`"></div>
                                  </div>
                                  <div class="ti-vt-stats mb-3">
                                    <div class="ti-vt-stat-tile ti-vt-stat-mal">
                                      <div class="ti-vt-stat-val" x-text="vtStatsBreakdown(src.data).malicious"></div>
                                      <div class="ti-vt-stat-lbl">Malicious</div>
                                    </div>
                                    <div class="ti-vt-stat-tile ti-vt-stat-sus">
                                      <div class="ti-vt-stat-val" x-text="vtStatsBreakdown(src.data).suspicious"></div>
                                      <div class="ti-vt-stat-lbl">Suspicious</div>
                                    </div>
                                    <div class="ti-vt-stat-tile ti-vt-stat-clean">
                                      <div class="ti-vt-stat-val" x-text="vtStatsBreakdown(src.data).undetected + vtStatsBreakdown(src.data).harmless"></div>
                                      <div class="ti-vt-stat-lbl">Undetected</div>
                                    </div>
                                    <div class="ti-vt-stat-tile ti-vt-stat-unk">
                                      <div class="ti-vt-stat-val" x-text="vtStatsBreakdown(src.data).timeout"></div>
                                      <div class="ti-vt-stat-lbl">Timeout</div>
                                    </div>
                                  </div>
                                </div>
                              </template>
                              <div class="flex gap-3 flex-wrap" style="font-size:10px;color:var(--text-muted);">
                                <template x-if="(src.data.data && src.data.data.attributes && src.data.data.attributes.first_submission_date) || (src.data.attributes && src.data.attributes.first_submission_date)">
                                  <span x-text="'First seen: ' + new Date(((src.data.data && src.data.data.attributes && src.data.data.attributes.first_submission_date) || (src.data.attributes && src.data.attributes.first_submission_date)) * 1000).toLocaleDateString()"></span>
                                </template>
                                <template x-if="(src.data.data && src.data.data.attributes && src.data.data.attributes.last_analysis_date) || (src.data.attributes && src.data.attributes.last_analysis_date)">
                                  <span x-text="'Last analysis: ' + new Date(((src.data.data && src.data.data.attributes && src.data.data.attributes.last_analysis_date) || (src.data.attributes && src.data.attributes.last_analysis_date)) * 1000).toLocaleDateString()"></span>
                                </template>
                              </div>
                              <div class="mt-2">
                                <a :href="src.url" target="_blank" rel="noopener noreferrer"
                                   class="btn btn-sm btn-secondary" style="font-size:10px;text-decoration:none;">View on VirusTotal</a>
                              </div>
                            </div>
                          </template>

                          <!-- AbuseIPDB smart card -->
                          <template x-if="!src.error && src.data && !src.data.not_found && src.source === 'abuseipdb'">
                            <div>
                              <div class="flex items-start gap-4 mb-3">
                                <div class="ti-abuse-ring-wrap">
                                  <div class="ti-abuse-ring-outer" :style="abuseScoreRingStyle((src.data.data || src.data).abuseConfidenceScore || (src.data.data || src.data).abuse_confidence_score || 0)"></div>
                                  <div class="ti-abuse-ring-inner"
                                       :style="`color:${((src.data.data || src.data).abuseConfidenceScore || (src.data.data || src.data).abuse_confidence_score || 0) >= 75 ? '#ff4444' : ((src.data.data || src.data).abuseConfidenceScore || (src.data.data || src.data).abuse_confidence_score || 0) >= 40 ? '#ff9900' : '#00cc66'}`">
                                    <span x-text="((src.data.data || src.data).abuseConfidenceScore || (src.data.data || src.data).abuse_confidence_score || 0) + '%'"></span>
                                    <small>Abuse Score</small>
                                  </div>
                                </div>
                                <div style="flex:1;min-width:0;">
                                  <div class="ti-geo-grid" style="grid-template-columns:1fr 1fr;gap:5px;">
                                    <template x-if="(src.data.data || src.data).totalReports !== undefined">
                                      <div class="ti-geo-item"><div class="ti-geo-label">Total Reports</div><div class="ti-geo-value" x-text="(src.data.data || src.data).totalReports"></div></div>
                                    </template>
                                    <template x-if="(src.data.data || src.data).numDistinctUsers !== undefined">
                                      <div class="ti-geo-item"><div class="ti-geo-label">Distinct Reporters</div><div class="ti-geo-value" x-text="(src.data.data || src.data).numDistinctUsers"></div></div>
                                    </template>
                                    <template x-if="(src.data.data || src.data).isp">
                                      <div class="ti-geo-item"><div class="ti-geo-label">ISP</div><div class="ti-geo-value" x-text="(src.data.data || src.data).isp"></div></div>
                                    </template>
                                    <template x-if="(src.data.data || src.data).countryCode">
                                      <div class="ti-geo-item"><div class="ti-geo-label">Country</div><div class="ti-geo-value" x-text="(src.data.data || src.data).countryCode"></div></div>
                                    </template>
                                  </div>
                                </div>
                              </div>
                              <template x-if="(src.data.data || src.data).lastReportedAt">
                                <div style="font-size:10px;color:var(--text-muted);margin-bottom:6px;"
                                     x-text="'Last report: ' + formatDate((src.data.data || src.data).lastReportedAt)"></div>
                              </template>
                              <template x-if="(src.data.data || src.data).usageType">
                                <div style="font-size:11px;color:var(--text-secondary);margin-bottom:6px;"
                                     x-text="'Usage: ' + (src.data.data || src.data).usageType"></div>
                              </template>
                            </div>
                          </template>

                          <!-- AlienVault OTX smart card -->
                          <template x-if="!src.error && src.data && !src.data.not_found && src.source === 'alienvault'">
                            <div>
                              <div class="flex gap-2 flex-wrap mb-2" style="font-size:10px;">
                                <span x-show="src.data.type_title" class="badge badge-gray" x-text="src.data.type_title"></span>
                                <span :class="(src.data.pulse_info && src.data.pulse_info.count > 0) ? 'badge badge-red' : 'badge badge-gray'"
                                      x-text="(src.data.pulse_info ? src.data.pulse_info.count : src.data.pulse_count || 0) + ' pulse(s)'"></span>
                                <span x-show="src.data.reputation !== undefined"
                                      :class="src.data.reputation < 0 ? 'badge badge-red' : 'badge badge-gray'"
                                      x-text="'Rep: ' + src.data.reputation"></span>
                                <template x-if="src.data.country_name">
                                  <span class="badge badge-gray" x-text="src.data.country_name + (src.data.country_code ? ' (' + src.data.country_code + ')' : '')"></span>
                                </template>
                                <template x-for="link in otxLinks(src.data)" :key="link.label">
                                  <a :href="link.url" target="_blank" rel="noopener noreferrer"
                                     class="badge badge-gray" style="text-decoration:none;"
                                     x-text="'&#x2197; ' + link.label"></a>
                                </template>
                              </div>
                              <template x-if="src.data.pulse_info && src.data.pulse_info.pulses && src.data.pulse_info.pulses.length > 0">
                                <div>
                                  <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;">
                                    Pulses (<span x-text="src.data.pulse_info.pulses.length"></span>)
                                  </div>
                                  <template x-for="(pulse, idx) in src.data.pulse_info.pulses.slice(0,5)" :key="pulse.id || idx">
                                    <div class="ti-pulse-item">
                                      <div class="flex items-center gap-2 flex-wrap mb-1">

                  <div x-show="activeResultTab === 'artifacts'">

                                </template>
                              </div>
                            </div>
                          </template>
                          <template x-if="normalized.artifacts.domains && normalized.artifacts.domains.length > 0">
                            <div style="margin-bottom:14px;">
                              <div style="font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em;">Domains</div>
                              <div class="flex gap-1 flex-wrap">
                                <template x-for="d in normalized.artifacts.domains" :key="d">
                                  <span class="ti-artifact-chip"
                                        @click="iocForm.ioc = d; iocForm.ioc_type = 'domain'; runSearch();"

                                </template>
                              </div>
                            </div>
                          </template>
                          <template x-if="normalized.artifacts.urls && normalized.artifacts.urls.length > 0">
                            <div style="margin-bottom:14px;">
                              <div style="font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em;">URLs</div>
                              <div class="flex gap-1 flex-wrap">
                                <template x-for="u in normalized.artifacts.urls" :key="u">
                                  <span class="ti-artifact-chip"
                                        @click="iocForm.ioc = u; iocForm.ioc_type = 'url'; runSearch();"
                                        title="Click to search this URL">🔗 <span x-text="u.length > 60 ? u.slice(0,60) + '…' : u"></span></span>
                                </template>
                              </div>
                            </div>
                          </template>
                          <template x-if="normalized.artifacts.hashes && normalized.artifacts.hashes.length > 0">
                            <div style="margin-bottom:14px;">
                              <div style="font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em;">File Hashes</div>
                              <div class="flex gap-1 flex-wrap">
                                <template x-for="h in normalized.artifacts.hashes" :key="h">
                                  <span class="ti-artifact-chip"
                                        @click="iocForm.ioc = h; iocForm.ioc_type = 'hash'; runSearch();"

                                </template>
                              </div>
                            </div>
                          </template>
                        </div>
                      </template>
                    </div>
                  </div>

                  <!-- Tab: Timeline -->
                  <div x-show="activeResultTab === 'timeline'">
                    <div class="card">
                      <div class="card-title">Event Timeline</div>
                      <template x-if="!hasTimeline">
                        <div class="text-center text-muted" style="padding:20px;">No timeline events available</div>
                      </template>
                      <template x-if="hasTimeline">
                        <div class="ti-timeline-v2 mt-3">
                          <template x-for="ev in sortedTimeline" :key="ev.date + ev.event">
                            <div class="ti-timeline-v2-item">
                              <div class="ti-timeline-v2-dot"></div>
                              <div class="ti-timeline-v2-date" x-text="formatDate(ev.date)"></div>
                              <div class="ti-timeline-v2-text" x-text="ev.event"></div>
                              <div class="ti-timeline-v2-src">
                                <span x-text="ev.source"></span>
                              </div>
                            </div>
                          </template>
                        </div>
                      </template>
                    </div>
                  </div>

                  <!-- Tab: Sources (per-source detail) -->
                  <div x-show="activeResultTab === 'sources'">
                    <template x-for="src in perSource" :key="src.source">
                      <div class="ti-result-card mb-3"
                           :class="[
                             src.error ? 'ti-threat-error has-error' : '',
                             src.source === 'virustotal' ? 'ti-source-virustotal' :
                             src.source === 'abuseipdb' ? 'ti-source-abuseipdb' :
                             src.source === 'alienvault' ? 'ti-source-alienvault' :
                             src.source === 'shodan' ? 'ti-source-shodan' :
                             src.source === 'malwarebazaar' ? 'ti-source-malwarebazaar' :
                             src.source === 'threatfox' ? 'ti-source-threatfox' :
                             src.source === 'urlhaus' ? 'ti-source-urlhaus' :
                             src.source === 'hibp' ? 'ti-source-hibp' :
                             src.source === 'censys' ? 'ti-source-censys' :
                             src.source === 'urlscan' ? 'ti-source-urlscan' :
                             src.source === 'securitytrails' ? 'ti-source-securitytrails' : ''
                           ]">
                        <!-- Source header -->
                        <div class="flex items-center justify-between mb-2">
                          <div class="flex items-center gap-2">
                            <span style="font-weight:700;font-size:13px;" x-text="src.name"></span>
                            <template x-if="src.free">
                              <span style="font-size:9px;padding:1px 5px;border-radius:4px;background:rgba(0,180,216,0.15);color:#38bdf8;font-weight:700;">FREE</span>
                            </template>
                            <a :href="src.url" target="_blank" rel="noopener noreferrer"
                               class="badge badge-gray text-xs" style="text-decoration:none;">↗</a>
                          </div>
                          <button class="btn btn-sm btn-secondary" style="font-size:10px;padding:2px 7px;"
                                  @click="openRaw(src.name, src.data)">🔍 Raw JSON</button>
                        </div>
                        <!-- OTX header pills: indicator type, pulse count, reputation, whois/alexa links -->
                        <template x-if="src.source === 'alienvault' && src.data && src.data.pulse_info">
                          <div class="flex gap-2 flex-wrap mb-2" style="font-size:10px;">
                            <span x-show="src.data.type_title" class="badge badge-gray"
                                  x-text="src.data.type_title"></span>
                            <span :class="src.data.pulse_info.count > 0 ? 'badge badge-red' : 'badge badge-gray'"

                            <span x-show="src.data.reputation !== undefined"
                                  :class="src.data.reputation < 0 ? 'badge badge-red' : 'badge badge-gray'"
