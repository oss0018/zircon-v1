                                    placeholder='{"query_type":"domain"}'></textarea>

                      </template>
                    </div>
                  </div>

                  <div class="card" style="padding:12px;margin-bottom:12px;">
                    <div class="flex justify-between items-center mb-2">

                      <label class="flex items-center gap-2">
                        <input type="checkbox" x-model="newJob.checks.watchlist_check.enabled" />
                        <span class="text-sm">Enabled</span>
                      </label>
                    </div>
                    <div x-show="newJob.checks.watchlist_check.enabled">
                      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;max-height:160px;overflow:auto;">
                        <template x-for="item in options.watchlist_items" :key="item.id">
                          <label class="badge badge-gray" style="display:flex;align-items:center;gap:6px;padding:8px 10px;">
                            <input type="checkbox" :value="item.id" x-model="newJob.checks.watchlist_check.watchlist_item_ids" />
                            <span x-text="item.type + ': ' + item.value"></span>
                          </label>
                        </template>
                      </div>
                      <label class="form-label">Matching mode</label>
                      <select class="form-select" x-model="newJob.checks.watchlist_check.matching_mode">

                        <option value="exact">Exact</option>
                      </select>
                    </div>
                  </div>

                  <div class="card" style="padding:12px;margin-bottom:12px;">
                    <div class="flex justify-between items-center mb-2">

                      <label class="flex items-center gap-2">

                            <input type="checkbox" :value="brand.id" x-model="newJob.checks.brand_scan.brand_ids" />

                          </label>

                      </div>
                    </div>

                  <div class="modal-footer">
                    <button class="btn btn-secondary" @click="showModal = false" x-text="t('cancel')"></button>
                    <button class="btn btn-primary" @click="saveJob()" x-text="t('save')"></button>
                  </div>
                </div>

                <div class="text-muted" style="max-width:760px;font-size:0.92rem;line-height:1.6;">

                  </div>
                  <span :class="scanProgress.running ? 'badge badge-yellow' : 'badge badge-green'" x-text="scanProgress.running ? 'Running' : 'Completed'"></span>

                <div style="height:10px;background:rgba(255,255,255,0.06);border-radius:999px;overflow:hidden;margin-bottom:8px;">

                </div>
                <div class="flex gap-2 mb-3" style="flex-wrap:wrap;" x-show="scanProgress.summary">

                  <span class="badge badge-red">Registered <span x-text="scanProgress.summary && scanProgress.summary.registered"></span></span>
                  <span class="badge badge-green">Trusted <span x-text="scanProgress.summary && scanProgress.summary.trusted"></span></span>
                  <span class="badge badge-gray">Unregistered <span x-text="scanProgress.summary && scanProgress.summary.unregistered"></span></span>

                      <span :class="statusBadge(item.status)" x-text="item.status"></span>

                </div>

                      <thead>
                        <tr>
                          <th>Name</th>
                          <th>Protected Domain</th>
                          <th>Brand</th>
                          <th>TLD List</th>
                          <th>Threshold%</th>
                          <th>Last Scan</th>
                          <th>Active</th>
                          <th>Actions</th>

                      </thead>
                      <tbody>

                                <button class="btn btn-sm btn-danger" @click="deleteRule(rule)">Delete</button>

                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>

                <!-- Add form -->
                <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;">
                  <input class="form-input" style="flex:1;min-width:180px;max-width:300px;" placeholder="example.com"

                  <input class="form-input" style="flex:1;min-width:130px;max-width:220px;" placeholder="Notes (optional)"

                    <input type="checkbox" x-model="newOwnedDomain.match_subdomains" />

                  </label>
                  <button class="btn btn-sm btn-primary" @click="addOwnedDomain()">+ Add</button>

                    <input type="file" accept=".txt" style="display:none;" @change="importOwnedDomainsFromFile($event)" />
                  </label>
                </div>
                <!-- List -->

                      <tr style="border-bottom:1px solid var(--border-color);">

                        <th style="padding:4px 8px;"></th>

                    <tbody>

                            <option value="5000">5k</option>
                            <option value="10000">10k</option>
                            <option value="25000">25k</option>
                            <option value="50000">50k</option>
                          </select>

                            <option value="brand_name">Brand name</option>
                            <option value="both">Both</option>

            <!-- ── WATCHLIST ───────────────────────────────────────── -->
            <div x-show="page === 'watchlist'" x-data="{
              items: [], integrations: [], loading: false, showModal: false,
              /* Drawer state */
              showDrawer: false,
              drawerReport: null,
              drawerTabs: {},
              modalMode: 'create',
              editingItemId: null,
              newItem: { type: 'email', value: '', integrations_json: '[]', alert_email: '', alert_telegram: '' },
              itemTypes: ['email', 'domain', 'ip', 'keyword', 'brand'],
              ctxMenu: { show: false, x: 0, y: 0, item: null },
              async init() {
                await this.load();
                try { const i = await api.get('/integrations/'); this.integrations = i.filter(x=>x.is_active); } catch {}
                document.addEventListener('click', () => { this.ctxMenu.show = false; });
                document.addEventListener('keydown', e => { if(e.key==='Escape') { this.ctxMenu.show = false; this.showDrawer = false; } });
              },
              async load() {
                this.loading = true;
                try {
                  const data = await api.get('/watchlist/');
                  this.items = data.map(item => ({ ...item, _checking: false }));
                } catch(e) { showToast(e.message,'error'); } finally { this.loading = false; }
              },
              _resetModalForm() {
                this.newItem = { type: 'email', value: '', integrations_json: '[]', alert_email: '', alert_telegram: '' };
                this.selectedIntegrations = [];
                this.editingItemId = null;
                this.modalMode = 'create';
              },
              openCreateModal() {
                this._resetModalForm();
                this.showModal = true;
              },
              openEditModal(item) {
                let integrations = [];
                try { integrations = JSON.parse(item.integrations_json || '[]'); } catch {}
                this.newItem = {
                  type: item.type || 'email',
                  value: item.value || '',
                  integrations_json: item.integrations_json || '[]',
                  alert_email: item.alert_email || '',
                  alert_telegram: item.alert_telegram || '',
                };
                this.selectedIntegrations = Array.isArray(integrations) ? integrations : [];
                this.editingItemId = item.id;
                this.modalMode = 'edit';
                this.showModal = true;
              },
              closeModal() {
                this.showModal = false;
                this._resetModalForm();
              },
              async saveItem() {
                try {
                  this.newItem.integrations_json = JSON.stringify(this.selectedIntegrations || []);
                  if (this.modalMode === 'edit' && this.editingItemId) {
                    await api.put('/watchlist/' + this.editingItemId, this.newItem);
                    showToast('Updated', 'success');
                  } else {
                    await api.post('/watchlist/', this.newItem);
                    showToast('Added', 'success');
                  }
                  await this.load();
                  this.closeModal();
                } catch(e) { showToast(e.message,'error'); }
              },
              isChecking(id) {
                const item = this.items.find(i => i.id === id);
                return item ? !!item._checking : false;
              },
              _setItemChecking(id, val) {
                const item = this.items.find(i => i.id === id);
                if (item) item._checking = val;
              },
              _hasSummaryData(normalized) {
                if (!normalized || typeof normalized !== 'object') return false;
                if (normalized.status && normalized.status !== 'success') return true;
                const summaryFields = ['main_ip', 'asn', 'org', 'country', 'final_url', 'title', 'provider_url', 'screenshot_url', 'scan_age', 'multi_scan_summary'];
                if (summaryFields.some(field => normalized[field])) return true;
                if (normalized.http_info || normalized.dns_info) return true;
                if (normalized.indicators && normalized.indicators.length) return true;
                if (normalized.tags && normalized.tags.length) return true;
                return !!normalized.total_results;
              },
              _normalizeUrlscanFromRaw(raw, source, target, targetType, checkedAt) {
                if (!raw || typeof raw !== 'object') return null;
                const normalized = {
                  source: source,
                  target: target,
                  target_type: targetType,
                  checked_at: checkedAt,
                  status: 'success',
                  verdict: null,
                  verdict_score: null,
                  main_ip: null,
                  asn: null,
                  org: null,
                  country: null,
                  final_url: null,
                  title: null,
                  tags: [],
                  scan_age: null,
                  provider_url: null,
                  screenshot_url: null,
                  indicators: null,
                  http_info: null,
                  dns_info: null,
                  links: null,
                  total_results: 0,
                  urlscan_details: null,
                };
                if (raw.error) {
                  const err = String(raw.error).toLowerCase();
                  normalized.status = (err.includes('rate') || err.includes('429')) ? 'rate_limited' : 'failed';
                  return normalized;
                }
                if (raw.not_found) {
                  normalized.status = 'no_data';
                  return normalized;
                }
                if (raw.uuid && raw.message) {
                  normalized.status = 'pending';
                  normalized.provider_url = raw.result || null;
                  return normalized;
                }
                const results = Array.isArray(raw.results) ? raw.results : [];
                normalized.total_results = Number(raw.total ?? results.length ?? 0);
                if (!results.length) {
                  normalized.status = 'no_data';
                  return normalized;
                }
                const r0 = results[0] || {};
                const page = r0.page || {};
                const task = r0.task || {};
                const verdicts = r0.verdicts || {};
                const overall = verdicts.overall || {};
                normalized.main_ip = page.ip || null;
                normalized.asn = page.asn || null;
                normalized.org = page.asnname || null;
                normalized.country = page.country || null;
                normalized.final_url = page.url || task.url || null;
                normalized.title = page.title || null;
                normalized.scan_age = task.time || null;
                normalized.provider_url = r0.result || task.reportURL || null;
                normalized.screenshot_url = r0.screenshot || (r0.task?.uuid ? `https://urlscan.io/screenshots/${r0.task.uuid}.png` : null);
                const score = Number(overall.score || 0);
                normalized.verdict_score = score;
                if (overall.malicious || score >= 70) normalized.verdict = 'malicious';
                else if (score >= 30) normalized.verdict = 'suspicious';
                else normalized.verdict = 'clean';
                const tagSet = new Set();
                (overall.categories || []).forEach(t => t && tagSet.add(String(t)));
                (overall.tags || []).forEach(t => t && tagSet.add(String(t)));
                (overall.brands || []).forEach(t => {
                  if (!t) return;
                  if (typeof t === 'object' && t.name) tagSet.add(String(t.name));
                  else tagSet.add(String(t));
                });
                normalized.tags = Array.from(tagSet);
                const httpStatus = page.status || null;
                if (httpStatus || page.server || page.mimeType || normalized.final_url) {
                  normalized.http_info = {
                    status: httpStatus,
                    server: page.server || null,
                    mime_type: page.mimeType || null,
                    final_url: normalized.final_url,
                  };
                }
                if (page.ptr || page.domain || page.apexDomain) {
                  normalized.dns_info = {
                    ptr: page.ptr || null,
                    domain: page.domain || null,
                    apex_domain: page.apexDomain || null,
                  };
                }
                const indicators = [];
                if (normalized.main_ip && (normalized.verdict === 'malicious' || normalized.verdict === 'suspicious')) {
                  indicators.push({ type: 'ip', value: normalized.main_ip, context: 'Main IP' });
                }
                const engines = verdicts.engines || {};
                const maliciousEngines = Number(engines.malicious || 0);
                const benignEngines = Number(engines.benign || 0);
                if (maliciousEngines > 0) {
                  indicators.push({ type: 'verdict', value: `${maliciousEngines} malicious engine detection(s)`, context: `${benignEngines} benign` });
                }
                normalized.indicators = indicators.length ? indicators : null;
                if (results.length > 1) {
                  const maliciousCount = results.filter(rx => !!(((rx || {}).verdicts || {}).overall || {}).malicious).length;
                  if (maliciousCount) normalized.multi_scan_summary = `${maliciousCount}/${results.length} scans flagged as malicious`;
                }
                normalized.urlscan_details = {
                  domain: page.domain || null,
                  country: page.country || null,
                  server: page.server || null,
                  redirected: page.redirected || null,
                  ip: page.ip || null,
                  apexDomainAgeDays: page.apexDomainAgeDays !== undefined ? page.apexDomainAgeDays : null,
                  language: page.language || null,
                  apexDomain: page.apexDomain || null,
                  result_url: r0.result || null,
                  screenshot_url: normalized.screenshot_url,
                  uuid: task.uuid || null,
                  total_results: normalized.total_results,
                };
                return normalized;
              },
              normalizeResultEntry(entry, report) {
                if (entry.normalized && this._hasSummaryData(entry.normalized)) return entry.normalized;
                const source = String(entry.source || '').toLowerCase();
                if (source === 'urlscan' || source === 'urlscan.io') {
                  return this._normalizeUrlscanFromRaw(entry.data, entry.source, report.value, report.type, report.checked_at);
                }
                return entry.normalized || null;
              },
              genericFields(data) {
                if (!data || typeof data !== 'object') return [];
                if (data.error) return [{ label: 'Error', value: String(data.error) }];
                if (data.not_found) return [{ label: 'Status', value: 'Not found' }];
                const important = ['ip','ip_str','domain','url','country','country_name','org','isp','asn','threat','score','result','status','message','query_status','abuseConfidenceScore','totalReports','positives','total','pulse_count'];
                const src = (data.data && typeof data.data === 'object') ? Object.assign({}, data, data.data) : data;
                const fields = [];
                important.forEach(k => { const v = src[k]; if (v !== undefined && v !== null && v !== '' && typeof v !== 'object') fields.push({ label: k.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()), value: String(v).substring(0,200) }); });
                if (!fields.length) Object.entries(src).slice(0,8).forEach(([k,v]) => { if (typeof v !== 'object' && v !== null && v !== undefined && v !== '') fields.push({ label: k.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()), value: String(v).substring(0,200) }); });
                return fields;
              },
              async checkItem(id) {
                if (!id || this.isChecking(id)) return;
                this._setItemChecking(id, true);
                this.showDrawer = false;
                this.drawerReport = null;
                try {
                  const result = await api.post('/watchlist/' + id + '/check');
                  result.results = (result.results || []).map(r => ({ ...r, normalized: this.normalizeResultEntry(r, result) }));
                  this.drawerReport = result;
                  this.drawerTabs = {};
                  this.showDrawer = true;
                  showToast('Check complete', 'success');
                } catch(e) { showToast(e.message,'error'); } finally { this._setItemChecking(id, false); }
              },
              async deleteItem(id) {
                if(!confirm(t('confirm_delete'))) return;
                try { await api.delete('/watchlist/' + id); this.items = this.items.filter(i=>i.id!==id); showToast('Deleted','success'); }
                catch(e) { showToast(e.message,'error'); }
              },
              /* Drawer helpers */
              closeDrawer() { this.showDrawer = false; },
              getTab(src) { return this.drawerTabs[src] || 'summary'; },
              setTab(src, tab) { this.drawerTabs = Object.assign({}, this.drawerTabs, {[src]: tab}); },
              verdictClass(v) {
                const m = { malicious:'scan-drawer-verdict-malicious', suspicious:'scan-drawer-verdict-suspicious', clean:'scan-drawer-verdict-clean', pending:'scan-drawer-verdict-pending' };
                return 'scan-drawer-verdict-badge ' + (m[v] || 'scan-drawer-verdict-unknown');
              },
              copyRawJSON() {
                const text = JSON.stringify(this.drawerReport, null, 2);
                navigator.clipboard.writeText(text)
                  .then(() => showToast('Copied to clipboard', 'success'))
                  .catch(() => showToast('Failed to copy', 'error'));
              },
              selectedIntegrations: [],
              toggleInteg(t) { const i=this.selectedIntegrations.indexOf(t); if(i>=0) this.selectedIntegrations.splice(i,1); else this.selectedIntegrations.push(t); },
              showCtxMenu(e, item) {
                e.preventDefault(); e.stopPropagation();
                const x = Math.min(e.clientX, window.innerWidth - 200);
                const y = Math.min(e.clientY, window.innerHeight - 120);
                this.ctxMenu = { show: true, x, y, item };
              },
              ctxOpenNewWindow() {
                this.ctxMenu.show = false;
                window.open('/?page=watchlist', '_blank');
              },
            }">
              <!-- Context Menu -->
              <div x-show="ctxMenu.show" class="context-menu"
                   :style="`left:${ctxMenu.x}px;top:${ctxMenu.y}px;`"
                   @click.stop="">
                <button class="context-menu-item" @click="ctxMenu.show=false; checkItem(ctxMenu.item && ctxMenu.item.id)">✅ Check now</button>
                <button class="context-menu-item" @click="ctxMenu.show=false; if(ctxMenu.item){ openEditModal(ctxMenu.item); }">✏️ Edit</button>
                <button class="context-menu-item" @click="ctxOpenNewWindow()">🪟 Open in new window</button>
                <hr class="context-menu-sep">
                <button class="context-menu-item danger" @click="ctxMenu.show=false; deleteItem(ctxMenu.item && ctxMenu.item.id)">🗑️ Delete</button>
              </div>

              <!-- Breadcrumbs -->
              <div class="flex items-center gap-1 mb-4 text-sm" style="color:var(--text-muted);">
                <span>Automation</span>
                <span style="margin:0 4px;">›</span>
                <span style="color:var(--accent-green);" x-text="t('watchlist')"></span>
              </div>

              <div class="flex justify-between items-center mb-4">
                <div></div>
                <button class="btn btn-primary" @click="openCreateModal()" x-text="t('add_item')"></button>
              </div>

              <div class="table-wrapper">
                <table>
                  <thead>
                    <tr>
                      <th x-text="t('item_type')"></th>
                      <th x-text="t('item_value')"></th>
                      <th>Integrations</th>
                      <th>Alert Email</th>
                      <th x-text="t('created_at')"></th>
                      <th x-text="t('actions')"></th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-if="items.length === 0">
                      <tr><td colspan="6" style="text-align:center;padding:30px;color:var(--text-muted);" x-text="t('no_data')"></td></tr>
                    </template>
                    <template x-for="item in items" :key="item.id">
                      <tr @contextmenu.prevent="showCtxMenu($event, item)" style="cursor:context-menu;">
                        <td><span class="badge badge-blue" x-text="item.type"></span></td>
                        <td class="font-mono" x-text="item.value"></td>
                        <td class="text-xs text-muted" x-text="item.integrations_json"></td>
                        <td x-text="item.alert_email || '—'"></td>
                        <td x-text="formatDate(item.created_at)"></td>
                        <td>
                          <div class="flex gap-2">
                            <button class="btn btn-sm btn-secondary" @click="openEditModal(item)">✏️</button>
                            <button class="btn btn-sm btn-primary" @click="checkItem(item.id)" :disabled="isChecking(item.id)">
                              <span x-text="isChecking(item.id) ? 'Checking…' : t('check_now')"></span>
                            </button>
                            <button class="btn btn-sm btn-danger" @click="deleteItem(item.id)">✕</button>
                          </div>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>

              <!-- ── Scan Report Drawer ─────────────────────────────────── -->
              <!-- Overlay -->
              <div x-show="showDrawer" class="scan-drawer-overlay" @click="closeDrawer()"></div>

              <!-- Drawer Panel -->
              <div x-show="showDrawer" class="scan-drawer" @click.stop="">

                <!-- Header -->
                <div class="scan-drawer-header">
                  <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-2 flex-wrap">
                      <span class="badge badge-blue" x-text="drawerReport && drawerReport.type"></span>
                      <span class="font-mono" style="font-size:13px;color:var(--text-primary);word-break:break-all;" x-text="drawerReport && drawerReport.value"></span>
                    </div>
                    <button class="btn btn-sm btn-secondary" style="flex-shrink:0;padding:2px 10px;margin-left:8px;" @click="closeDrawer()">✕</button>
                  </div>

                  <!-- Timestamp + source count -->
                  <div class="flex items-center gap-2 mb-3" style="font-size:11px;color:var(--text-muted);">
                    <span x-text="drawerReport && formatDate(drawerReport.checked_at)"></span>
                    <span>·</span>
                    <span x-text="(drawerReport && drawerReport.results && drawerReport.results.length || 0) + ' source(s)'"></span>
                  </div>

                  <!-- Action buttons -->
                  <div class="flex gap-2 flex-wrap">
                    <template x-for="r in (drawerReport ? drawerReport.results : [])" :key="'action-' + r.source">
                      <template x-if="r.normalized && r.normalized.provider_url">
                        <a :href="r.normalized.provider_url" target="_blank" rel="noopener noreferrer"
                           class="btn btn-sm btn-secondary" style="text-decoration:none;">
                          ↗ Open in <span x-text="r.source" style="text-transform:capitalize;"></span>
                        </a>
                      </template>
                    </template>
                    <button class="btn btn-sm btn-secondary" @click="copyRawJSON()">📋 Copy JSON</button>
                  </div>
                </div>

                <!-- Body -->
                <div class="scan-drawer-body">

                  <!-- Empty state -->
                  <template x-if="!drawerReport || !drawerReport.results || drawerReport.results.length === 0">
                    <div style="text-align:center;color:var(--text-muted);padding:48px 20px;">
                      <div style="font-size:32px;margin-bottom:10px;">🔍</div>
                      <div>No results found for this item</div>
                    </div>
                  </template>

                  <!-- Per-source result sections -->
                  <template x-for="r in (drawerReport ? drawerReport.results : [])" :key="r.source">
                    <div class="scan-source-section">

                      <!-- Source header: name + verdict badge -->
                      <div class="flex items-center justify-between mb-3">
                        <div class="result-source" x-text="r.source.toUpperCase()" style="margin-bottom:0;"></div>
                        <div class="flex items-center gap-2">
                          <template x-if="r.normalized && r.normalized.verdict">
                            <span :class="verdictClass(r.normalized.verdict)"
                                  x-text="r.normalized.verdict"></span>
                          </template>
                          <template x-if="r.normalized && r.normalized.verdict_score !== null && r.normalized.verdict_score !== undefined">
                            <span class="badge badge-gray" style="font-size:9px;" x-text="'Score: ' + r.normalized.verdict_score"></span>
                          </template>
                        </div>
                      </div>

                      <!-- Non-success status -->
                      <template x-if="r.normalized && r.normalized.status !== 'success'">
                        <div>
                          <template x-if="r.normalized.status === 'rate_limited'">
                            <div class="alert alert-warning" style="margin-bottom:8px;">⚠️ Rate limited — please try again later</div>
                          </template>
                          <template x-if="r.normalized.status === 'failed'">
                            <div class="alert alert-error" style="margin-bottom:8px;">❌ Request failed</div>
                          </template>
                          <template x-if="r.normalized.status === 'no_data'">
                            <div style="color:var(--text-muted);font-size:13px;padding:8px 0;">No scan data found for this target</div>
                          </template>
                          <template x-if="r.normalized.status === 'pending'">
                            <div class="alert alert-info" style="margin-bottom:8px;">⏳ Scan submitted — check back shortly</div>
                          </template>
                        </div>
                      </template>

                      <!-- Success: tab-based content -->
                      <template x-if="r.normalized && r.normalized.status === 'success'">
                        <div>
                          <!-- Tab bar -->
                          <div class="ti-tabs">
                            <button class="ti-tab" :class="getTab(r.source) === 'summary' ? 'active' : ''"
                                    @click="setTab(r.source, 'summary')">Summary</button>
                            <button class="ti-tab"
                                    :class="getTab(r.source) === 'urlscan_details' ? 'active' : ''"
                                    x-show="r.source === 'urlscan' && r.normalized && r.normalized.urlscan_details"
                                    @click="setTab(r.source, 'urlscan_details')">
                              🔍 URLscan Details
                            </button>
                            <button class="ti-tab"
                                    :class="getTab(r.source) === 'indicators' ? 'active' : ''"
                                    x-show="r.normalized.indicators && r.normalized.indicators.length > 0"
                                    @click="setTab(r.source, 'indicators')">
                              Indicators
                              <span class="ti-tab-badge" x-text="r.normalized.indicators && r.normalized.indicators.length"></span>
                            </button>
                            <button class="ti-tab"
                                    :class="getTab(r.source) === 'http' ? 'active' : ''"
                                    x-show="r.normalized.http_info"
                                    @click="setTab(r.source, 'http')">HTTP</button>
                            <button class="ti-tab"
                                    :class="getTab(r.source) === 'dns' ? 'active' : ''"
                                    x-show="r.normalized.dns_info"
                                    @click="setTab(r.source, 'dns')">DNS</button>
                            <button class="ti-tab" :class="getTab(r.source) === 'raw' ? 'active' : ''"
                                    @click="setTab(r.source, 'raw')">Raw</button>
                          </div>

                          <!-- Tab: Summary -->
                          <div x-show="getTab(r.source) === 'summary'">
                            <!-- Screenshot -->
                            <template x-if="r.normalized.screenshot_url">
                              <img :src="r.normalized.screenshot_url" alt="Screenshot" class="scan-drawer-screenshot"
                                   onerror="this.style.display='none'" />
                            </template>

                            <!-- Multi-scan note -->
                            <template x-if="r.normalized.multi_scan_summary">
                              <div class="alert alert-warning" style="margin-bottom:10px;font-size:11px;" x-text="r.normalized.multi_scan_summary"></div>
                            </template>

                            <!-- Key fields grid -->
                            <div class="ti-fields-grid">
                              <template x-if="r.normalized.main_ip">
                                <div class="ti-field">
                                  <div class="ti-field-label">Main IP</div>
                                  <div class="ti-field-value font-mono" x-text="r.normalized.main_ip"></div>
                                </div>
                              </template>
                              <template x-if="r.normalized.asn">
                                <div class="ti-field">
                                  <div class="ti-field-label">ASN</div>
                                  <div class="ti-field-value font-mono" x-text="r.normalized.asn"></div>
                                </div>
                              </template>
                              <template x-if="r.normalized.org">
                                <div class="ti-field">
                                  <div class="ti-field-label">Organization</div>
                                  <div class="ti-field-value" x-text="r.normalized.org"></div>
                                </div>
                              </template>
                              <template x-if="r.normalized.country">
                                <div class="ti-field">
                                  <div class="ti-field-label">Country</div>
                                  <div class="ti-field-value" x-text="r.normalized.country"></div>
                                </div>
                              </template>
                              <template x-if="r.normalized.final_url">
                                <div class="ti-field">
                                  <div class="ti-field-label">Final URL</div>
                                  <div class="ti-field-value">
                                    <a :href="r.normalized.final_url" target="_blank" rel="noopener noreferrer"
                                       class="text-green" style="word-break:break-all;font-size:11px;"
                                       x-text="r.normalized.final_url"></a>
                                  </div>
                                </div>
                              </template>
                              <template x-if="r.normalized.title">
                                <div class="ti-field">
                                  <div class="ti-field-label">Page Title</div>
                                  <div class="ti-field-value" x-text="r.normalized.title"></div>
                                </div>
                              </template>
                              <template x-if="r.normalized.scan_age">
                                <div class="ti-field">
                                  <div class="ti-field-label">Scan Age</div>
                                  <div class="ti-field-value" x-text="formatDate(r.normalized.scan_age)"></div>
                                </div>
                              </template>
                              <template x-if="r.normalized.total_results">
                                <div class="ti-field">
                                  <div class="ti-field-label">Total Scans</div>
                                  <div class="ti-field-value" x-text="r.normalized.total_results"></div>
                                </div>
                              </template>
                            </div>

                            <!-- Tags -->
                            <template x-if="r.normalized.tags && r.normalized.tags.length > 0">
                              <div style="margin-top:12px;">
                                <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">Tags</div>
                                <div class="flex gap-1 flex-wrap">
                                  <template x-for="tag in r.normalized.tags" :key="tag">
                                    <span class="badge badge-gray" style="font-size:10px;" x-text="tag"></span>
                                  </template>
                                </div>
                              </div>
                            </template>

                            <!-- Fallback generic display when all normalized fields are null -->
                            <template x-if="!r.normalized.main_ip && !r.normalized.final_url && !r.normalized.title && !(r.normalized.indicators && r.normalized.indicators.length) && !r.normalized.total_results && !(r.normalized.tags && r.normalized.tags.length)">
                              <div class="ti-fields-grid">
                                <template x-for="field in genericFields(r.data)" :key="field.label">
                                  <div class="ti-field">
                                    <div class="ti-field-label" x-text="field.label"></div>
                                    <div class="ti-field-value" x-text="field.value"></div>
                                  </div>
                                </template>
                                <template x-if="!genericFields(r.data).length">
                                  <div class="text-muted text-sm" style="padding:8px 0;">No structured data — see Raw tab.</div>
                                </template>
                              </div>
                            </template>
                          </div>

                          <!-- Tab: URLscan Details -->
                          <div x-show="getTab(r.source) === 'urlscan_details'" x-cloak>
                            <template x-if="r.normalized.urlscan_details">
                              <div>
                                <!-- Screenshot -->
                                <template x-if="r.normalized.screenshot_url">
                                  <div style="margin-bottom:12px;">
                                    <div style="font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">Screenshot</div>
                                    <img :src="r.normalized.screenshot_url" alt="URLscan Screenshot"
                                         style="width:100%;border-radius:6px;border:1px solid var(--border-color);display:block;"
                                         onerror="this.style.display='none'" />
                                  </div>
                                </template>

                                <!-- Details grid -->
                                <div class="ti-fields-grid" style="margin-bottom:12px;">
                                  <template x-if="r.normalized.urlscan_details.domain">
                                    <div class="ti-field">
                                      <div class="ti-field-label">Domain</div>
                                      <div class="ti-field-value font-mono" x-text="r.normalized.urlscan_details.domain"></div>
                                    </div>
                                  </template>
                                  <template x-if="r.normalized.urlscan_details.apexDomain">
                                    <div class="ti-field">
                                      <div class="ti-field-label">Apex Domain</div>
                                      <div class="ti-field-value font-mono" x-text="r.normalized.urlscan_details.apexDomain"></div>
                                    </div>
                                  </template>
                                  <template x-if="r.normalized.urlscan_details.ip">
                                    <div class="ti-field">
                                      <div class="ti-field-label">IP Address</div>
                                      <div class="ti-field-value font-mono" x-text="r.normalized.urlscan_details.ip"></div>
                                    </div>
                                  </template>
                                  <template x-if="r.normalized.urlscan_details.country">
                                    <div class="ti-field">
                                      <div class="ti-field-label">Country</div>
                                      <div class="ti-field-value" x-text="r.normalized.urlscan_details.country"></div>
                                    </div>
                                  </template>
                                  <template x-if="r.normalized.urlscan_details.server">
                                    <div class="ti-field">
                                      <div class="ti-field-label">Server</div>
                                      <div class="ti-field-value font-mono" x-text="r.normalized.urlscan_details.server"></div>
                                    </div>
                                  </template>
                                  <template x-if="r.normalized.urlscan_details.language">
                                    <div class="ti-field">
                                      <div class="ti-field-label">Language</div>
                                      <div class="ti-field-value" x-text="r.normalized.urlscan_details.language"></div>
                                    </div>
                                  </template>
                                  <template x-if="r.normalized.urlscan_details.apexDomainAgeDays != null">
                                    <div class="ti-field">
                                      <div class="ti-field-label">Domain Age (days)</div>
                                      <div class="ti-field-value" x-text="r.normalized.urlscan_details.apexDomainAgeDays"></div>
                                    </div>
                                  </template>
                                  <template x-if="r.normalized.urlscan_details.redirected">
                                    <div class="ti-field ti-field-warning">
                                      <div class="ti-field-label">Redirected To</div>
                                      <div class="ti-field-value font-mono" style="word-break:break-all;" x-text="r.normalized.urlscan_details.redirected"></div>
                                    </div>
                                  </template>
                                  <template x-if="r.normalized.urlscan_details.total_results">
                                    <div class="ti-field">
                                      <div class="ti-field-label">Total Scans Found</div>
                                      <div class="ti-field-value" x-text="r.normalized.urlscan_details.total_results"></div>
                                    </div>
                                  </template>
                                </div>

                                <!-- Full report link -->
                                <template x-if="r.normalized.urlscan_details.result_url">
                                  <a :href="r.normalized.urlscan_details.result_url" target="_blank" rel="noopener noreferrer"
                                     class="btn btn-sm btn-secondary" style="width:100%;text-align:center;display:block;">
                                    🔗 Open Full URLscan Report ↗
                                  </a>
                                </template>
                              </div>
                            </template>
                          </div>

                          <!-- Tab: Indicators -->
                          <div x-show="getTab(r.source) === 'indicators'">
                            <template x-for="(ind, idx) in (r.normalized.indicators || [])" :key="idx">
                              <div class="ti-detection-row">
                                <span class="badge badge-gray" style="font-size:9px;text-transform:uppercase;flex-shrink:0;" x-text="ind.type"></span>
                                <span class="font-mono" style="font-size:11px;flex:1;word-break:break-all;" x-text="ind.value"></span>
                                <span style="font-size:10px;color:var(--text-muted);flex-shrink:0;" x-text="ind.context || ''"></span>
                              </div>
                            </template>
                          </div>

                          <!-- Tab: HTTP -->
                          <div x-show="getTab(r.source) === 'http'">
                            <template x-if="r.normalized.http_info">
                              <div class="ti-fields-grid">
                                <template x-if="r.normalized.http_info.status">
                                  <div class="ti-field">
                                    <div class="ti-field-label">HTTP Status</div>
                                    <div class="ti-field-value">
                                      <span :class="parseInt(r.normalized.http_info.status) < 400 ? 'badge badge-green' : 'badge badge-red'"
                                            x-text="r.normalized.http_info.status"></span>
                                    </div>
                                  </div>
                                </template>
                                <template x-if="r.normalized.http_info.server">
                                  <div class="ti-field">
                                    <div class="ti-field-label">Server</div>
                                    <div class="ti-field-value font-mono" x-text="r.normalized.http_info.server"></div>
                                  </div>
                                </template>
                                <template x-if="r.normalized.http_info.mime_type">
                                  <div class="ti-field">
                                    <div class="ti-field-label">MIME Type</div>
                                    <div class="ti-field-value font-mono" x-text="r.normalized.http_info.mime_type"></div>
                                  </div>
                                </template>
                                <template x-if="r.normalized.http_info.final_url">
                                  <div class="ti-field">
                                    <div class="ti-field-label">Final URL</div>
                                    <div class="ti-field-value">
                                      <a :href="r.normalized.http_info.final_url" target="_blank" rel="noopener noreferrer"
                                         class="text-green" style="word-break:break-all;font-size:11px;"
                                         x-text="r.normalized.http_info.final_url"></a>
                                    </div>
                                  </div>
                                </template>
                              </div>
                            </template>
                          </div>

                          <!-- Tab: DNS -->
                          <div x-show="getTab(r.source) === 'dns'">
                            <template x-if="r.normalized.dns_info">
                              <div class="ti-fields-grid">
                                <template x-if="r.normalized.dns_info.domain">
                                  <div class="ti-field">
                                    <div class="ti-field-label">Domain</div>
                                    <div class="ti-field-value font-mono" x-text="r.normalized.dns_info.domain"></div>
                                  </div>
                                </template>
                                <template x-if="r.normalized.dns_info.apex_domain">
                                  <div class="ti-field">
                                    <div class="ti-field-label">Apex Domain</div>
                                    <div class="ti-field-value font-mono" x-text="r.normalized.dns_info.apex_domain"></div>
                                  </div>
                                </template>
                                <template x-if="r.normalized.dns_info.ptr">
                                  <div class="ti-field">
                                    <div class="ti-field-label">PTR</div>
                                    <div class="ti-field-value font-mono" x-text="r.normalized.dns_info.ptr"></div>
                                  </div>
                                </template>
                              </div>
                            </template>
                          </div>

                          <!-- Tab: Raw -->
                          <div x-show="getTab(r.source) === 'raw'">
                            <div class="json-viewer" x-text="JSON.stringify(r.data, null, 2)"></div>
                          </div>

                        </div>
                      </template>

                      <!-- No normalized data: fall back to raw JSON -->
                      <template x-if="!r.normalized">
                        <div class="json-viewer" x-text="formatJSON(r.data)"></div>
                      </template>

                    </div>
                  </template>

                </div><!-- /scan-drawer-body -->
              </div><!-- /scan-drawer -->

              <!-- Add Modal -->
              <div x-show="showModal" class="modal-overlay" @click.self="closeModal()">
                <div class="modal">
                  <div class="modal-title" x-text="modalMode === 'edit' ? 'Edit Watchlist Item' : t('add_watchlist_item')"></div>
                  <div class="form-group">
                    <label class="form-label" x-text="t('item_type')"></label>
                    <select class="form-select" x-model="newItem.type">
                      <template x-for="it in itemTypes" :key="it">
                        <option :value="it" x-text="it"></option>
                      </template>
                    </select>
                  </div>
                  <div class="form-group">
                    <label class="form-label" x-text="t('item_value')"></label>
                    <input class="form-input" x-model="newItem.value" placeholder="email@example.com / domain.com / 1.2.3.4" />
                  </div>
                  <div class="form-group">
                    <label class="form-label" x-text="t('integrations_to_use')"></label>
                    <div style="display:flex;flex-wrap:wrap;gap:6px;">
                      <template x-for="i in integrations" :key="i.id">
                        <button class="btn btn-sm btn-secondary"
                                :style="selectedIntegrations.includes(i.service_type) ? 'border-color:var(--accent-green);color:var(--accent-green)' : ''"
                                @click="toggleInteg(i.service_type)" x-text="i.name"></button>
                      </template>
                      <template x-if="integrations.length === 0">
                        <span class="text-muted text-sm">No active integrations</span>
                      </template>
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="form-label" x-text="t('alert_email')"></label>
                    <input class="form-input" type="email" x-model="newItem.alert_email" placeholder="alert@example.com" />
                  </div>
                  <div class="form-group">
                    <label class="form-label" x-text="t('alert_telegram')"></label>
                    <input class="form-input" x-model="newItem.alert_telegram" placeholder="@username or chat_id" />
                  </div>
                  <div class="modal-footer">
                    <button class="btn btn-secondary" @click="closeModal()" x-text="t('cancel')"></button>
                    <button class="btn btn-primary" @click="saveItem()" x-text="t('save')"></button>
                  </div>
                </div>
              </div>
            </div>

            <!-- ── NOTIFICATIONS ──────────────────────────────────── -->
            <div x-show="page === 'notifications'" x-data="{
              notifications: [], loading: false,
              async init() { await this.load(); },
              async load() {
                this.loading = true;
                try { this.notifications = await api.get('/dashboard/notifications?limit=100'); }
                catch(e) { showToast(e.message,'error'); } finally { this.loading = false; }
              },
              async markRead(id) {
                try { await api.post('/dashboard/notifications/' + id + '/read'); await this.load(); }
                catch(e) {}
              },
              async markAllRead() {
                try { await api.post('/dashboard/notifications/read-all'); await this.load(); showToast('All marked as read','success'); }
                catch(e) { showToast(e.message,'error'); }
              },
              typeClass(type) { const m={info:'badge-blue',success:'badge-green',error:'badge-red',warning:'badge-yellow'}; return m[type]||'badge-gray'; },
            }">
              <div class="flex justify-between items-center mb-4">
                <div></div>
                <button class="btn btn-secondary" @click="markAllRead()" x-text="t('mark_all_read')"></button>
              </div>

              <template x-if="notifications.length === 0">
                <div class="card text-center" style="color:var(--text-muted);" x-text="t('no_data')"></div>
              </template>

              <template x-for="n in notifications" :key="n.id">
                <div class="card mb-4" :style="!n.read ? 'border-color: rgba(0,180,216,0.3)' : ''">
                  <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center gap-2">
                      <span :class="'badge ' + typeClass(n.type)" x-text="n.type.toUpperCase()"></span>
                      <span style="font-weight:600;" x-text="n.title"></span>
                    </div>
                    <div class="flex items-center gap-2">
                      <span class="text-xs text-muted" x-text="formatDate(n.created_at)"></span>
                      <button x-show="!n.read" class="btn btn-sm btn-secondary" @click="markRead(n.id)" x-text="t('mark_read')"></button>
                    </div>
                  </div>
                  <div class="text-sm text-muted" x-text="n.message" x-show="n.message"></div>
                </div>
              </template>
            </div>

            <!-- ── SETTINGS ──────────────────────────────────────── -->
            <div x-show="page === 'settings'" x-data="settingsPage" x-init="init()">

              <!-- Tabs -->
              <div class="flex gap-2 mb-4" style="flex-wrap:wrap;">
                <button class="btn btn-sm" :class="activeTab==='profile'?'btn-primary':'btn-secondary'"
                        @click="switchTab('profile')" x-text="t('profile')"></button>
                <button x-show="isAdmin()" class="btn btn-sm" :class="activeTab==='users'?'btn-primary':'btn-secondary'"
                        @click="switchTab('users')" x-text="t('users')"></button>
                <button class="btn btn-sm" :class="activeTab==='watched_folders'?'btn-primary':'btn-secondary'"
                        @click="switchTab('watched_folders')" x-text="t('watched_folders')"></button>
                <button class="btn btn-sm" :class="activeTab==='notifications'?'btn-primary':'btn-secondary'"
                        @click="switchTab('notifications')" x-text="t('notification_settings')"></button>

                                  <button class="btn btn-sm btn-secondary" @click="openResetModal(u)" x-text="t('reset_password')"></button>
                                  <button class="btn btn-sm btn-danger" @click="deleteUser(u.id)" x-text="t('delete')"></button>
                                </div>
                              </td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </template>
                </div>

                <!-- Create User Modal -->
                <div x-show="showCreateUserModal" class="modal-overlay" @click.self="showCreateUserModal=false">
                  <div class="modal">
                    <div class="modal-title" x-text="t('create_user')"></div>
                    <div class="form-group">
                      <label class="form-label" x-text="t('username')"></label>
                      <input class="form-input" type="text" x-model="newUser.username" />
                    </div>
                    <div class="form-group">
                      <label class="form-label" x-text="t('password')"></label>
                      <input class="form-input" type="password" x-model="newUser.password" />
                    </div>
                    <div class="form-group">
                      <label class="form-label" x-text="t('role')"></label>
                      <select class="form-select" x-model="newUser.role">
                        <option value="user">user</option>
                        <option value="admin">admin</option>
                      </select>
                    </div>
                    <div class="modal-footer">
                      <button class="btn btn-secondary" @click="showCreateUserModal=false" x-text="t('cancel')"></button>
                      <button class="btn btn-primary" @click="createUser()" :disabled="createUserLoading">
                        <span x-show="createUserLoading" class="spinner" style="width:14px;height:14px;"></span>
                        <span x-text="createUserLoading ? t('loading') : t('create_user')"></span>
                      </button>
                    </div>
                  </div>
                </div>

                <!-- Reset Password Modal -->
                <div x-show="showResetModal" class="modal-overlay" @click.self="showResetModal=false">
                  <div class="modal">
                    <div class="modal-title" x-text="t('reset_password') + ': ' + (resetTarget ? resetTarget.username : '')"></div>
                    <div class="form-group">
                      <label class="form-label" x-text="t('new_password')"></label>
                      <input class="form-input" type="password" x-model="resetPassword" />
                    </div>
                    <div class="modal-footer">
                      <button class="btn btn-secondary" @click="showResetModal=false" x-text="t('cancel')"></button>
                      <button class="btn btn-primary" @click="doResetPassword()" :disabled="resetLoading">
                        <span x-show="resetLoading" class="spinner" style="width:14px;height:14px;"></span>
                        <span x-text="resetLoading ? t('loading') : t('save')"></span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <!-- ── Watched Folders Tab ── -->
              <div x-show="activeTab==='watched_folders'">
                <div class="card mb-4">
                  <div class="card-title" x-text="t('add_watched_folder')"></div>
                  <p class="text-sm text-muted mb-4" x-text="t('watched_folders_hint')"></p>
                  <div class="flex gap-2">
                    <input class="form-input" type="text" x-model="newFolderPath"
                           :placeholder="t('folder_path_placeholder')"
                           @keyup.enter="addFolder()" style="flex:1;" />
                    <button class="btn btn-primary" @click="addFolder()" :disabled="addFolderLoading">
                      <span x-show="addFolderLoading" class="spinner" style="width:14px;height:14px;"></span>
                      <span x-text="addFolderLoading ? t('loading') : t('add')"></span>
                    </button>
                  </div>
                </div>

                <div x-show="foldersLoading" class="text-muted text-sm" x-text="t('loading')"></div>
                <div x-show="!foldersLoading">
                  <template x-if="folders.length===0">
                    <div class="card text-center text-muted" x-text="t('no_data')"></div>
                  </template>
                  <template x-if="folders.length>0">
                    <div class="card" style="overflow-x:auto;">
                      <table style="width:100%;border-collapse:collapse;">
                        <thead>
                          <tr style="border-bottom:1px solid var(--border-color);">
                            <th style="text-align:left;padding:8px;font-size:12px;color:var(--text-muted);" x-text="t('folder_path')"></th>
                            <th style="text-align:left;padding:8px;font-size:12px;color:var(--text-muted);" x-text="t('files_count')"></th>
                            <th style="text-align:left;padding:8px;font-size:12px;color:var(--text-muted);" x-text="t('last_scan')"></th>
                            <th style="text-align:left;padding:8px;font-size:12px;color:var(--text-muted);" x-text="t('status')"></th>
                            <th style="text-align:left;padding:8px;font-size:12px;color:var(--text-muted);" x-text="t('actions')"></th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="f in folders" :key="f.id">
                            <tr style="border-bottom:1px solid var(--border-color);">
                              <td style="padding:8px;font-size:13px;word-break:break-all;" x-text="f.path"></td>
                              <td style="padding:8px;font-size:13px;" x-text="f.files_count"></td>
                              <td style="padding:8px;font-size:12px;color:var(--text-muted);" x-text="f.last_scan ? formatDate(f.last_scan) : '—'"></td>
                              <td style="padding:8px;">
                                <span :class="'badge ' + (f.is_active?'badge-green':'badge-gray')"
                                      x-text="f.is_active ? t('active') : t('inactive')"></span>
                              </td>
                              <td style="padding:8px;">
                                <div class="flex gap-2">
                                  <button class="btn btn-sm btn-secondary" @click="scanFolder(f.id)" x-text="t('scan_now')"></button>
                                  <button class="btn btn-sm btn-danger" @click="removeFolder(f.id)" x-text="t('delete')"></button>
                                </div>
                              </td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </template>
                </div>
              </div>

              <!-- ── Notifications Tab ── -->
              <div x-show="activeTab==='notifications'" class="card" style="max-width:540px;">
                <div class="card-title" x-text="t('notification_settings')"></div>

                <div style="font-weight:600;margin-bottom:8px;margin-top:8px;">SMTP</div>
                <div class="form-group">
                  <label class="form-label">Host</label>
                  <input class="form-input" type="text" x-model="notifSettings.smtp_host" placeholder="smtp.example.com" />
                </div>
                <div class="form-group">
                  <label class="form-label">Port</label>
                  <input class="form-input" type="number" x-model="notifSettings.smtp_port" placeholder="587" />
                </div>
                <div class="form-group">
                  <label class="form-label" x-text="t('username')"></label>
                  <input class="form-input" type="text" x-model="notifSettings.smtp_user" />
                </div>
                <div class="form-group">
                  <label class="form-label" x-text="t('password')"></label>
                  <input class="form-input" type="password" x-model="notifSettings.smtp_password" />
                </div>

                <div style="font-weight:600;margin-bottom:8px;margin-top:16px;">Telegram</div>
                <div class="form-group">
                  <label class="form-label">Bot Token</label>
                  <input class="form-input" type="text" x-model="notifSettings.telegram_token" />
                </div>
                <div class="form-group">
                  <label class="form-label">Chat ID</label>
                  <input class="form-input" type="text" x-model="notifSettings.telegram_chat_id" />
                </div>

                <button class="btn btn-primary" @click="saveNotifSettings()" :disabled="notifSaveLoading">
                  <span x-show="notifSaveLoading" class="spinner" style="width:14px;height:14px;"></span>
                  <span x-text="notifSaveLoading ? t('loading') : t('save')"></span>
                </button>
              </div>

              <!-- ── System Tab ── -->
              <div x-show="activeTab==='system'">
                <div x-show="systemLoading" class="text-muted text-sm" x-text="t('loading')"></div>
                <div x-show="!systemLoading && systemInfo">
                  <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px;">
                    <div class="stat-card">
                      <div class="stat-label">Python Version</div>
                      <div class="stat-value text-sm" x-text="systemInfo ? systemInfo.python_version : '—'"></div>
                    </div>
                    <div class="stat-card">
                      <div class="stat-label">Database Size</div>
                      <div class="stat-value text-sm" x-text="systemInfo ? formatBytes(systemInfo.db_size) : '—'"></div>
                    </div>
                    <div class="stat-card">
                      <div class="stat-label">Index Size</div>
                      <div class="stat-value text-sm" x-text="systemInfo ? formatBytes(systemInfo.index_size) : '—'"></div>
                    </div>
                  </div>
                </div>
                <div class="flex gap-2">
                  <button class="btn btn-secondary" @click="reindexAll()" :disabled="reindexLoading">
                    <span x-show="reindexLoading" class="spinner" style="width:14px;height:14px;"></span>
                    <span x-text="reindexLoading ? t('loading') : t('reindex_all')"></span>
                  </button>
                  <button class="btn btn-secondary" @click="clearCache()" :disabled="clearCacheLoading">
                    <span x-show="clearCacheLoading" class="spinner" style="width:14px;height:14px;"></span>
                    <span x-text="clearCacheLoading ? t('loading') : t('clear_cache')"></span>
                  </button>
                </div>
              </div>

            </div><!-- /settings -->

            <!-- ── DEEP SEARCH ────────────────────────────────── -->
            <div x-show="page === 'deep-search'" x-data="deepSearchPage" x-init="init()">

              <!-- Tab switcher -->
              <div class="flex gap-2 mb-4 items-center" style="border-bottom:1px solid var(--border-color);padding-bottom:10px;flex-wrap:wrap;">
                <button x-show="!useApiMode && isAdminUser" class="btn btn-sm" :class="activeTab==='tree' ? 'btn-primary' : 'btn-secondary'"
                        @click="activeTab='tree'">📁 Folder File Tree</button>
                <button class="btn btn-sm" :class="activeTab==='search' ? 'btn-primary' : 'btn-secondary'"
                        @click="activeTab='search'" x-text="useApiMode ? '🔍 Search' : '🔍 Deep Search'"></button>
                <button x-show="useApiMode" class="btn btn-sm" :class="activeTab==='leaks' ? 'btn-primary' : 'btn-secondary'"
                        @click="activeTab='leaks'; if (leaks.length === 0) loadLeaks()">🧪 Leaks</button>
                <button x-show="useApiMode" class="btn btn-sm" :class="activeTab==='file' ? 'btn-primary' : 'btn-secondary'"
                        @click="activeTab='file'">📄 File</button>
                <button x-show="!useApiMode" class="btn btn-sm" :class="activeTab==='viewer' ? 'btn-primary' : 'btn-secondary'"
                        @click="activeTab='viewer'">📄 File Viewer</button>
              </div>

              <!-- ── TAB: File Tree ── -->
              <div x-show="!useApiMode && activeTab==='tree'">

                <!-- Upload toolbar -->
                <div class="card mb-4" x-show="isAdminUser">
                  <div class="card-title">Upload Folder</div>
                  <div class="flex gap-2 items-center flex-wrap">
                    <input class="form-input" type="text" x-model="uploadFolderName"
                           placeholder="folder_name (e.g. domain_com_logs)" style="width:220px;" maxlength="200" />
                    <button class="btn btn-secondary" @click="triggerFolderUpload()" :disabled="uploadLoading">
                      <span x-show="uploadLoading" class="spinner" style="width:14px;height:14px;"></span>
                      <span>📂 Select Folder</span>
                    </button>
                    <button class="btn btn-primary" @click="uploadFolder()" :disabled="uploadLoading || !uploadFolderName.trim()">
                      <span x-show="uploadLoading" class="spinner" style="width:14px;height:14px;"></span>
                      <span x-text="uploadLoading ? 'Uploading...' : 'Upload'"></span>
                    </button>
                    <button class="btn btn-secondary" @click="loadTree(); loadFolders()">🔄 Refresh</button>
                  </div>
                  <!-- Hidden folder input -->
                  <input type="file" id="ds-folder-input" webkitdirectory multiple style="display:none;"
                         @change="uploadFolder()" />
                </div>

                <!-- Folder list with delete -->
                <template x-if="folders.length > 0">
                  <div class="card mb-4">
                    <div class="card-title flex items-center justify-between">
                      <span>Folders</span>
                      <button class="btn btn-sm btn-secondary" @click="toggleFoldersPanel()" x-text="foldersCollapsed ? '▶' : '▼'"></button>
                    </div>
                    <table class="table" x-show="!foldersCollapsed">
                      <thead><tr>
                        <th>Name</th><th>Files</th><th>Size</th><th>Created</th><th></th>
                      </tr></thead>
                      <tbody>
                        <template x-for="f in folders" :key="f.name">
                          <tr>
                            <td class="text-green cursor-pointer" @click="loadTree()" x-text="f.name"></td>
                            <td x-text="f.files_count"></td>
                            <td x-text="formatSize(f.size_bytes)"></td>
                            <td x-text="f.created_at ? f.created_at.substring(0,10) : '—'"></td>
                            <td>
                              <button class="btn btn-sm btn-danger" @click="deleteFolder(f.name)" x-show="isAdminUser">🗑 Delete</button>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>

                <!-- Tree view -->
                <div class="card" x-show="isAdminUser">
                  <div class="card-title flex justify-between items-center">
                    <div class="flex items-center gap-2">
                      <button x-show="navigationStack.length > 0" class="btn btn-sm btn-secondary"
                              @click="navBack()" title="Go back" style="padding:2px 8px;">← Back</button>
                      <span>Folder File Tree</span>
                    </div>
                    <div class="flex items-center gap-2">
                      <span x-show="treeLoading" class="spinner" style="width:14px;height:14px;"></span>
                      <button class="btn btn-sm btn-secondary" @click="toggleFolderTreePanel()" x-text="folderTreeCollapsed ? '▶' : '▼'"></button>
                    </div>
                  </div>
                  <div x-show="!folderTreeCollapsed">
                  <!-- Breadcrumbs -->
                  <div class="ft-breadcrumbs" x-show="navBreadcrumbParts.length > 0">
                    <span class="crumb" @click="navToIndex(-1)">Home</span>
                    <template x-for="(part, idx) in navBreadcrumbParts" :key="part + idx">
                      <span class="flex items-center gap-1">
                        <span class="sep">›</span>
                        <span class="crumb" :class="idx === navBreadcrumbParts.length - 1 ? 'active' : ''"
                              @click="idx < navBreadcrumbParts.length - 1 && navToIndex(idx)"
                              x-text="part"></span>
                      </span>
                    </template>
                  </div>
                  <template x-if="!treeLoading && treeData">
                    <div style="font-family:'JetBrains Mono',monospace;font-size:13px;">
                      <template x-for="child in (treeData.children || [])" :key="child.name">
                        <div x-data="{ node: child }">
                          <!-- Directory -->
                          <template x-if="node.type==='directory'">
                            <div>
                              <div class="flex items-center gap-1 cursor-pointer grep-line" style="padding:3px 0;"
                                   @click="toggleNode(node.name)"
                                   @dblclick.stop="navigateToFolder(node)"
                                   @contextmenu.stop="showContextMenu($event, {type:'directory', name:node.name, path:node.name, children:node.children})">
                                <span x-text="isCollapsed(node.name, true) ? '▶' : '▼'" style="color:var(--text-muted);font-size:10px;min-width:10px;"></span>
                                <span>📁</span>
                                <span class="text-green" x-text="node.name"></span>
                                <span class="badge badge-gray text-xs" x-text="(node.children||[]).length + ' items'"></span>
                                <button class="btn btn-sm btn-danger" style="margin-left:auto;padding:1px 6px;"
                                        @click.stop="deleteFolder(node.name)" title="Delete folder">🗑</button>
                              </div>
                              <!-- Children with CSS transition -->
                              <div :class="isCollapsed(node.name, true) ? 'ft-children collapsed' : 'ft-children'"
                                   style="padding-left:20px;">
                                <template x-for="sub in (node.children||[])" :key="sub.name + (sub.path||sub.name)">
                                  <div>
                                    <template x-if="sub.type==='file'">
                                      <div class="flex items-center gap-1 cursor-pointer grep-line"
                                           style="padding:2px 0;"
                                           @click="openFile(sub.path)"
                                           @contextmenu.stop="showContextMenu($event, {type:'file', name:sub.name, path:sub.path})">
                                        <span x-text="fileIcon(sub)"></span>
                                        <span x-text="sub.name" style="color:var(--text-primary);"></span>
                                        <span class="text-xs text-muted" x-text="formatSize(sub.size)"></span>
                                      </div>
                                    </template>
                                    <template x-if="sub.type==='directory'">
                                      <div>
                                        <div class="flex items-center gap-1 cursor-pointer grep-line" style="padding:2px 0;"
                                             @click="toggleNode(node.name+'/'+sub.name)"
                                             @dblclick.stop="navigateToFolder(sub)"
                                             @contextmenu.stop="showContextMenu($event, {type:'directory', name:sub.name, path:node.name+'/'+sub.name, children:sub.children})">
                                          <span x-text="isCollapsed(node.name+'/'+sub.name) ? '▶' : '▼'" style="color:var(--text-muted);font-size:10px;min-width:10px;"></span>
                                          <span>📁</span>
                                          <span class="text-green" x-text="sub.name"></span>
                                        </div>
                                        <div :class="isCollapsed(node.name+'/'+sub.name) ? 'ft-children collapsed' : 'ft-children'"
                                             style="padding-left:20px;">
                                          <template x-for="leaf in (sub.children||[])" :key="leaf.name + (leaf.path||leaf.name)">
                                            <div class="flex items-center gap-1 cursor-pointer grep-line"
                                                 style="padding:2px 0;"
                                                 @click="leaf.type==='file' && openFile(leaf.path)"
                                                 @contextmenu.stop="showContextMenu($event, leaf.type==='file' ? {type:'file', name:leaf.name, path:leaf.path} : {type:'directory', name:leaf.name, path:sub.name+'/'+leaf.name, children:leaf.children})">
                                              <span x-text="fileIcon(leaf)"></span>
                                              <span x-text="leaf.name"></span>
                                              <span x-show="leaf.type==='file'" class="text-xs text-muted" x-text="formatSize(leaf.size)"></span>
                                            </div>
                                          </template>
                                        </div>
                                      </div>
                                    </template>
                                  </div>
                                </template>
                              </div>
                            </div>
                          </template>
                          <!-- File at root level -->
                          <template x-if="node.type==='file'">
                            <div class="flex items-center gap-1 cursor-pointer grep-line" style="padding:3px 0;"
                                 @click="openFile(node.path)"
                                 @contextmenu.stop="showContextMenu($event, {type:'file', name:node.name, path:node.path})">
                              <span x-text="fileIcon(node)"></span>
                              <span x-text="node.name"></span>
                              <span class="text-xs text-muted" x-text="formatSize(node.size)"></span>
                            </div>
                          </template>
                        </div>
                      </template>
                      <template x-if="!treeData.children || treeData.children.length === 0">
